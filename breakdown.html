        "notes": "\n      <h3>🌟《Extr@ English》第01集：35句黄金母语台词全景大通关笔记</h3>\n      <p style=\"color: #94a3b8; margin-bottom: 16px;\">\n        本集精选 35 句高频母语表达，由 <b>Google Gemini Kore (温柔从容女声)</b> 全程深度精讲，涵盖发音连读同化、语块固定搭配与社交潜台词。\n      </p>\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n    \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 01 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：John [电话留言]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Did you get my message?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：你收到我的留言/消息了吗？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：did you 产生 /d/+/j/ 同化连读成 /dɪdʒu/，get 尾音轻微失爆</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Did you get...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：日常问别人‘收到消息没有’，教科书教的 Have you received 过于生硬拘谨。母语者本能使用 Did you get，极简且高频。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 02 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Bridget [单车怒斥]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"I told you last night.\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：我昨晚就跟你说过了。</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：told you 弱化同化成 /toʊldʒu/，last night 中的 /t/ 失去爆破</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>I told you...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：表达不耐烦、提醒对方‘我早就交代过’。told you 带强烈情绪下沉，直接传递边界感。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 03 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Bridget [设立红线]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"And don't call me Gigi.\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：还有，别叫我吉吉。</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：don't 中的 /t/ 弱化甚至不发音，call me 语气坚决短促</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>And don't call me...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：设立人际边界与尊严红线。拒绝别人叫自己讨厌的外号或昵称时的经典干脆表达。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 04 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Annie [八卦好奇]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Who from? What does it say?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：谁寄来的？信上写了什么？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：Who from 极简省略主谓；What does it say 连读为 /wɒt dʌz ɪt seɪ/</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Who from? / What does it say?</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：英语中问信件、报纸、路标‘写了什么’，动词一律用 say（说），绝不能用 write！这是母语者思维的核心标尺。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 05 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Hector [来信寄宿]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Do you have a bed for me?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：你们那儿有地方给我睡吗？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：have a 连读成 /hævə/，bed for 连贯流畅</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Do you have a bed for...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：询问借宿的经典母语表达。不说 can I sleep at your home，直接问 have a bed for me，形象且地道。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 06 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Bridget [顾虑质询]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"He wants to stay here. But what about the rules?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：他想住在这儿。但合租规矩怎么办？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：wants to 缩读成 wanna，what about 连读为 /wɒtəbaʊt/</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>What about the rules?</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：What about 是日常提出顾虑、协商条件时的万能句型，相当于‘那……又该怎么办呢？’。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 07 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Bridget & Annie [热情请客]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"We'll buy your lunch.\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：我们请你吃午饭。</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：We'll 发音舌尖抵上齿龈，buy your 自然过渡</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>We'll buy your...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：母语者表达‘请你吃饭/喝咖啡’，高频使用 buy someone something，远比生硬的 treat you 更加地道自然。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 08 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Annie [日常招待]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Would you like a drink?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：你想喝点什么吗？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：Would you 产生 /d/+/j/ 连读为 /wʊdʒu/，like a 连读成 /laɪkə/</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Would you like a...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：招待客人最得体、高频的破冰问句。drink 在此泛指茶、水、饮料或酒类。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 09 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Nick [打听八卦]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"What's she like?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：她人怎么样？/ 她是个什么样的人？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：What's 尾音轻柔带出，she like 语调上扬</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>What's ... like?</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：打听某人的性格、为人与综合特质专用句式！千万不要和 What does she look like（长什么样）混淆！</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 10 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Nick [主动好为人师]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Why don't I show you how to do it properly?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：不如我来教你正确的做法吧？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：Why don't I 连读，do it 连读为 /duːwɪt/，properly 重音在前</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Why don't I show you...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：Why don't I 是主动提出示范或帮助的委婉高情商句型，properly 强调‘规范、正确地’。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 11 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Bridget [严正警告]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Nick, I've told you before, nobody uses my bike.\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：尼克，我之前就跟你说过，谁都不能碰我的单车。</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：I've told you 摩擦连读，nobody uses 绝对否定词重读</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>nobody uses my...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：树立禁令时，母语者不用生硬的 you can't，而是用 nobody uses，绝对否定展现绝对权威。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 12 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Bridget [下最后通牒]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"If you touch my bike again, you are out!\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：要是你再碰我的车，你就给我出去/滚蛋！</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：touch my 顺滑衔接，you are out 爆发力强，out 重读降调</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>you are out!</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：You are out 原意出局，在日常口语中指‘你给我滚出去/被开除/不再是朋友’，最后通牒标配。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 13 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Bridget [威严定性]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Is that clear?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：听明白了吗？/ 清楚了吗？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：that clear 中间 /t/ 失去爆破，clear 降调下沉</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Is that clear?</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：交代完规则或训诫之后的权威确认，不容置疑，远比 Do you understand 更具压迫感。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 14 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Bridget [委婉澄清]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"No, you don't understand, we only have one bedroom.\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：不，你没搞懂，我们只有一间卧室。</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：don't understand 弱化衔接，only have 顺畅滑动</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>No, you don't understand...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：委婉指出对方认知偏差的温和开场白，表示‘你可能误会了/没弄明白我们的实际情况’。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 15 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Annie [心软妥协]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Well, you can sleep here.\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：行吧，你可以睡这儿。</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：Well 拖长展现思考与退让，sleep here 语气舒缓</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Well, you can...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：日常口语中开头的 Well 是神级语气词，代表经过权衡后的退让、包容与折中妥协。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 16 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Annie [招呼客人]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Just relax, I must go to the bathroom.\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：你先随意放松一下，我去趟洗手间。</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：Just relax 中的 /t/ 弱读，go to 弱化成 /gədə/</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Just relax / go to the bathroom</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：让客人‘随便坐、别拘束’的口语标配就是 Just relax 或 Make yourself at home。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 17 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Hector [礼貌求助]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"My luggage is downstairs. Could you bring it up?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：我的行李在楼下，能帮我拿上来吗？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：Could you 连读为 /kʊdʒu/，bring it up 三词连读为 /brɪŋɪtʌp/</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Could you bring it up?</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：高频礼貌求助句式。bring it up 意为拿上来，注意三个小词的连续连读连诵。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 18 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Nick [自我介绍]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"I live next door.\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：我就住在隔壁。</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：next door 中间 /t/ 失爆，door 尾音拉长</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>live next door</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：介绍邻里关系的固定搭配。next door 指隔壁邻居，日常交流高频出现。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 19 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Nick [探听虚实]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Does she know you are here?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：她知道你在这儿吗？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：Does she 发音顺滑成 /dʌzʃi/，here 语调上扬</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Does she know...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：打听第三方是否知情、是否有隐瞒。一般疑问句语调微扬，带着探究心理。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 20 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Bridget [点餐询问]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"What would you like to eat?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：你想吃点什么？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：What would you 快速连读为 /wɒt wʊdʒu/，like to 缩读 /laɪktə/</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>What would you like to...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：请客吃饭或点餐时最礼貌的征询句。比生硬的 What do you want to eat 更加体面得体。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 21 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Nick [邻里八卦]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"The chicks in the apartment opposite have a visitor.\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：对面公寓的姑娘们来了个客人。</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：chicks 俚语口语词，apartment opposite 快速连读</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>have a visitor</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：chicks 是英国/美国年轻人俚语指年轻女孩；have a visitor 委婉表示‘家里来了客人’。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 22 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Nick [确认理解]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"See what I mean?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：明白我的意思了吧？/ 懂我意思了吧？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：Do you 省略，what I 连读为 /wɒtaɪ/，mean 尾音上扬</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>See what I mean?</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：母语者口头禅之王！当发生的事情印证了自己的判断时，立刻丢出一句：See what I mean？</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 23 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Nick [挑衅较量]</span>\n          </div>\n          <div style=\"font-size: 16px; font-weight: 700; color: #fbbf24; margin-bottom: 4px;\">\"Can you cycle 50 kilometers?\"</div>\n          <div style=\"font-size: 14px; color: #f1f5f9; margin-bottom: 6px;\">中文：你能骑行50公里吗？</div>\n          <div style=\"font-size: 13px; color: #38bdf8; margin-bottom: 4px;\">🗣️ 连读/弱读：Can you 弱读 /kənju/，kilometers 重音在第二个音节</div>\n          <div style=\"font-size: 13px; color: #34d399; margin-bottom: 4px;\">💡 核心语块：<code>Can you cycle...</code></div>\n          <div style=\"font-size: 13px; color: #cbd5e1; line-height: 1.5; margin-top: 4px;\">🧠 语境与潜台词：挑战较量、质询体能时的直接疑问句，语气带有竞争意味。</div>\n        </div>\n        \n        <div style=\"background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 12px 16px;\">\n          <div style=\"display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;\">\n            <span style=\"background: #f59e0b; color: #000; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 4px;\">第 24 句</span>\n            <span style=\"color: #94a3b8; font-size: 13px;\">角色：Hector [自信应战]</span>\n          </div>\n          <div style=\"font-size: 16px; fon             <li><b>设立红线：</b><code>And don't call me [X]!</code> 强行剥夺对方叫亲昵小名的特权</li>
          </ul>
        `
      },
      {
        id: "ep01_short_bemyguest",
        title: "【短视频速学】老外说 Be my guest 到底是什么意思？",
        badge: "高频神句 · 竖屏 1080P",
        duration: "00:28",
        src: "videos/extra_ep01_short_bemyguest.mp4",
        desc: "28秒黄金短视频！切片 Hector 借浴室冲澡名场面，讲透为什么母语者不说 Yes 或 Sure，而是用 Be my guest。",
        chapters: [
          { time: 0, title: "00:00 黄金3秒吸睛 Hook" },
          { time: 5, title: "00:05 原片名场面还原" },
          { time: 13, title: "00:13 核心用法与避坑指南" }
        ],
        notes: `
          <h3>💡 Be my guest 核心用法</h3>
          <p><b>真正含义：</b>请便 / 随便用 / 别客气！（绝对不是“做我的客人”或“请客”！）</p>
          <ul>
            <li>借浴室/充电宝：“Can I use your charger?” ➔ “Be my guest!”</li>
            <li>拿最后一块食物：“Mind if I take this?” ➔ “Be my guest!”</li>
          </ul>
        `
      }
    ];

    let currentVideoIdx = 0;
    const videoEl = document.getElementById('mainVideo');
    const titleEl = document.getElementById('videoTitle');
    const badgeEl = document.getElementById('videoBadge');
    const descEl = document.getElementById('videoDesc');
    const chaptersGrid = document.getElementById('chaptersGrid');
    const notesContainer = document.getElementById('notesContainer');
    const playlistContainer = document.getElementById('playlistContainer');

    function loadVideo(index) {
      currentVideoIdx = index;
      const v = PLAYLIST[index];
      
      // Update DOM
      videoEl.src = v.src;
      titleEl.textContent = v.title;
      badgeEl.textContent = v.badge;
      descEl.textContent = v.desc;
      notesContainer.innerHTML = v.notes;

      // Update chapters
      chaptersGrid.innerHTML = '';
      v.chapters.forEach((ch, chIdx) => {
        const btn = document.createElement('button');
        btn.className = 'chapter-btn' + (chIdx === 0 ? ' active' : '');
        btn.innerHTML = `<span class="ch-time">${formatTime(ch.time)}</span><span>${ch.title.replace(/^\d+:\d+\s*/, '')}</span>`;
        btn.onclick = () => {
          videoEl.currentTime = ch.time;
          videoEl.play();
          updateActiveChapter(ch.time);
        };
        chaptersGrid.appendChild(btn);
      });

      // Update playlist selection styling
      renderPlaylist();
      videoEl.play();
    }

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      PLAYLIST.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'playlist-item' + (idx === currentVideoIdx ? ' active' : '');
        card.innerHTML = `
          <div class="item-top">
            <span class="item-tag ${idx === 0 ? 'master' : ''}">${item.badge.split('·')[0].trim()}</span>
            <span class="item-dur">${item.duration}</span>
          </div>
          <div class="item-title">${item.title}</div>
          <div class="item-desc">${item.desc}</div>
        `;
        card.onclick = () => loadVideo(idx);
        playlistContainer.appendChild(card);
      });
      document.getElementById('playlistCount').textContent = `${PLAYLIST.length} 部视频已就绪`;
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateActiveChapter(currentTime) {
      const v = PLAYLIST[currentVideoIdx];
      const buttons = chaptersGrid.querySelectorAll('.chapter-btn');
      let activeIdx = 0;
      for (let i = 0; i < v.chapters.length; i++) {
        if (currentTime >= v.chapters[i].time) {
          activeIdx = i;
        } else {
          break;
        }
      }
      buttons.forEach((btn, idx) => {
        if (idx === activeIdx) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    videoEl.addEventListener('timeupdate', () => {
      updateActiveChapter(videoEl.currentTime);
    });

    // Keyboard Shortcuts for Seeking & Navigation
    window.addEventListener('keydown', (e) => {
      // Don't intercept if user is typing in an input
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.code === 'ArrowRight' || e.key === 'l' || e.key === 'L') {
        e.preventDefault();
        videoEl.currentTime = Math.min(videoEl.duration || 999999, videoEl.currentTime + (e.code === 'ArrowRight' ? 5 : 10));
      } else if (e.code === 'ArrowLeft' || e.key === 'j' || e.key === 'J') {
        e.preventDefault();
        videoEl.currentTime = Math.max(0, videoEl.currentTime - (e.code === 'ArrowLeft' ? 5 : 10));
      } else if (e.code === 'Space') {
        e.preventDefault();
        if (videoEl.paused) videoEl.play();
        else videoEl.pause();
      }
    });

    // Initialize
    renderPlaylist();
    loadVideo(0);
  </script>
</body>
</html>
