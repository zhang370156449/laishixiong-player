const audio = new Audio();
let currentCardId = null;

function renderCards() {
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  ITEMS.forEach(it => {
    const card = document.createElement('div');
    card.className = 'dialogue-card';
    card.id = 'card_' + it.id;
    card.innerHTML = `
      <div class="card-header">
        <div class="speaker-title">
          <span>${it.speaker}</span>
          <span class="role-badge">${it.role}</span>
        </div>
        <div class="highlight-pill">${it.highlight}</div>
      </div>
      <div class="en-sentence">${it.en}</div>
      <div class="zh-sentence">${it.zh}</div>
      <div class="btn-group">
        <button class="btn-play btn-gemini" onclick="playAudio('${it.id}', '${it.gemini_b64}', 'Gemini (${it.gemini_voice})')">&#9654; Gemini 原生音频</button>
        <button class="btn-play btn-minimax" onclick="playAudio('${it.id}', '${it.minimax_b64}', 'MiniMax (${it.minimax_voice})')">&#9654; MiniMax 对比音频</button>
      </div>
    `;
    list.appendChild(card);
  });
}

function playAudio(id, b64, label) {
  if (!b64) return;
  audio.pause();
  
  document.querySelectorAll('.dialogue-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById('card_' + id);
  if (card) card.classList.add('active');

  document.getElementById('statusTip').innerText = '正在播放：' + label;

  audio.src = b64;
  audio.play();

  audio.onended = () => {
    document.getElementById('statusTip').innerText = '播放完毕';
    if (card) card.classList.remove('active');
  };
}

renderCards();
</script>
