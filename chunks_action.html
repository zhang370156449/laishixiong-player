    // Theme Management (Light vs Dark)
    const THEME_STORAGE_KEY = 'chunklab_theme';
    let currentTheme = 'light';

    function initTheme() {
      try {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'light';
        currentTheme = savedTheme;
      } catch(e) {
        currentTheme = 'light';
      }
      applyTheme();
    }

    function toggleTheme() {
      currentTheme = (currentTheme === 'light') ? 'dark' : 'light';
      try {
        localStorage.setItem(THEME_STORAGE_KEY, currentTheme);
      } catch(e) {}
      applyTheme();
    }

    function applyTheme() {
      const isDark = (currentTheme === 'dark');
      document.body.classList.toggle('theme-dark', isDark);
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      const btn = document.getElementById('btnThemeToggle');
      if (icon && label) {
        if (isDark) {
          icon.textContent = '☀️';
          label.textContent = '日间模式';
          if (btn) btn.classList.add('active');
        } else {
          icon.textContent = '🌙';
          label.textContent = '夜间模式';
          if (btn) btn.classList.remove('active');
        }
      }
    }

    // State Variables
    let currentScale = 1.0;
    const fontScales = [
      { label: '偏小', size: '16.5px' },
      { label: '标准', size: '18.5px' },
      { label: '放大', size: '20.5px' },
      { label: '超大', size: '23.0px' }
    ];
    let fontScaleIdx = 1;

    let currentSpeed = 1.0;
    const speeds = [1.0, 0.8, 1.2];
    let speedIdx = 0;

    let currentMask = 'none'; // 'none' | 'en' | 'zh'
    const maskModes = [
      { id: 'none', label: '正常' },
      { id: 'en', label: '遮英文' },
      { id: 'zh', label: '遮中文' }
    ];
    let maskIdx = 0;

    let onlyStarred = false;
    let starredIds = new Set();
    const STAR_STORAGE_KEY = 'chunklab_action_starred';

    let activeSection = null;
    let searchQuery = '';
    let isLooping = false;
    let loopItem = null;

    // Load Starred from localStorage
    try {
      const savedStars = localStorage.getItem(STAR_STORAGE_KEY);
      if (savedStars) {
        starredIds = new Set(JSON.parse(savedStars));
      }
    } catch(e) {}

    // Audio Engine
    class AudioEngine {
      constructor() {
        this.audio = new Audio();
        this.speechSynth = window.speechSynthesis;
        this.currentActiveEl = null;

        this.audio.onerror = () => {
          if (this.currentFallbackText) {
            this.speakText(this.currentFallbackText);
          }
        };

        this.audio.onended = () => {
          if (isLooping && loopItem) {
            this.playItem(loopItem);
          } else {
            this.clearPlayingUI();
          }
        };
      }

      playItem(item) {
        this.stop();
        loopItem = item;
        updateBottomPlayer(item);

        const text = item.en;
        this.currentFallbackText = text;

        if (item.localAudio) {
          let src = item.localAudio;
          if (window.location.protocol.startsWith('http')) {
            src += (src.includes('?') ? '&' : '?') + 't=' + Date.now();
          }
          this.audio.src = src;
          this.audio.playbackRate = currentSpeed;
          this.audio.play().catch(() => {
            this.speakText(text);
          });
        } else {
          this.speakText(text);
        }
      }

      speakText(text) {
        if (!this.speechSynth) return;
        this.speechSynth.cancel();

        const cleanText = text
          .replace(/\+\s*名词/g, '')
          .replace(/\+\s*动词[^\s]*/g, '')
          .replace(/\.(2,)/g, '')
          .replace(/[\/\(\)]/g, ' ')
          .replace(/\$/g, ' dollars ')
          .trim();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = currentSpeed;
        this.speechSynth.speak(utterance);
      }

      stop() {
        this.audio.pause();
        this.audio.currentTime = 0;
        if (this.speechSynth) this.speechSynth.cancel();
      }

      clearPlayingUI() {
        document.querySelectorAll('.is-speaking').forEach(el => el.classList.remove('is-speaking'));
        const btn = document.getElementById('btnPlayPause');
        if (btn) btn.textContent = '▶ 播放';
      }
    }

    const player = new AudioEngine();

    // Initialize UI
    function init() {
      initTheme();
      renderSectionPills();
      renderCards();
      bindEvents();
    }

    function renderSectionPills() {
      const sections = window.CURRENT_DB.sections;
      let html = `<button class="sec-pill ${activeSection === null ? 'active' : ''}" data-sec="all">全部 (${window.CURRENT_DB.cards.length})</button>`;

      sections.forEach(s => {
        html += `<button class="sec-pill ${activeSection === s.secIdx ? 'active' : ''}" data-sec="${s.secIdx}">${s.title} (${s.count})</button>`;
      });

      sectionPillBar.innerHTML = html;
    }

    function renderCards() {
      const sections = window.CURRENT_DB.sections;
      const allCards = window.CURRENT_DB.cards;

      let renderedSectionCount = 0;
      let totalRenderedCards = 0;
      let html = '';

      sections.forEach(sec => {
        if (activeSection !== null && sec.secIdx !== activeSection) return;

        const matchingCards = allCards.filter(c => {
          if (c.secIdx !== sec.secIdx) return false;
          if (onlyStarred && !starredIds.has(c.id)) return false;
          if (searchQuery) {
            const q = searchQuery;
            const inEn = (c.en || '').toLowerCase().includes(q);
            const inZh = (c.zh || '').toLowerCase().includes(q);
            const inCore = (c.core || '').toLowerCase().includes(q);
            const inUsage = (c.usage || '').toLowerCase().includes(q);
            const inWarn = (c.warn || '').toLowerCase().includes(q);
            const inEx = (c.examples || []).some(ex => (ex.en || '').toLowerCase().includes(q) || (ex.zh || '').toLowerCase().includes(q));
            const inChunks = (c.chunks || []).some(sc => (sc.en || '').toLowerCase().includes(q) || (sc.zh || '').toLowerCase().includes(q));
            const inDial = (c.dialogue || []).some(d => (d.en || '').toLowerCase().includes(q) || (d.zh || '').toLowerCase().includes(q));
            if (!inEn && !inZh && !inCore && !inUsage && !inWarn && !inEx && !inChunks && !inDial) return false;
          }
          return true;
        });

        if (matchingCards.length === 0) return;

        renderedSectionCount++;
        totalRenderedCards += matchingCards.length;

        html += `
          <section class="section-block" id="section-block-${sec.secIdx}">
            <div class="section-header-banner">
              <div>
                <h2>${sec.title}</h2>
                ${sec.intro ? `<p class="section-intro-text">${sec.intro}</p>` : ''}
              </div>
              <span class="section-badge-count">${matchingCards.length} 项</span>
            </div>

            <div class="cards-grid">
              ${matchingCards.map(c => renderSingleCard(c)).join('')}
            </div>
          </section>
        `;
      });

      if (totalRenderedCards === 0) {
        html = `
          <div style="text-align:center; padding: 60px 20px; color: #94a3b8;">
            <div style="font-size: 3rem; margin-bottom: 12px;">🔍</div>
            <h3 style="font-size: 1.2rem; color: #475569; margin-bottom: 6px;">没有找到符合条件的内容</h3>
            <p style="font-size: 0.9rem;">请尝试更换搜索关键词，或者重置生词本筛选条件</p>
          </div>
        `;
      }

      mainContainer.innerHTML = html;
      document.getElementById('totalCardBadge').textContent = `${totalRenderedCards} 词块`;
    }

    
    function renderSingleCard(card) {
      const isStarred = starredIds.has(card.id);

      const subchunksHtml = (card.chunks || []).map((sc, idx) => `
        <div class="subchunk-card" id="sc-${card.id}-${idx}">
          <div class="subchunk-content" onclick="playSubChunk(${card.id}, ${idx})">
            <span class="subchunk-code"><code>${sc.en}</code></span>
            <span class="subchunk-zh">${sc.zh}</span>
          </div>
          <button class="btn-audio-play" onclick="playSubChunk(${card.id}, ${idx}, event)" title="点击发音">▶</button>
        </div>
      `).join('');

      const dialogueHtml = (card.dialogue && card.dialogue.length) ? `
        <div class="dialogue-wrap">
          <div class="dialogue-header-bar">
            <span>💬 场景实战对话</span>
            ${card.dialogueLocal ? `
              <button class="btn-dialogue-play" onclick="playDialogue(${card.id}, event)" title="点击收听整段对话">
                <span>▶</span> <span>整段对话点读</span>
              </button>
            ` : ''}
          </div>
          <div class="dialogue-lines">
            ${card.dialogue.map(d => `
              <div class="dialogue-row" onclick="playDialogue(${card.id}, event)" title="点击收听整段场景对话">
                <span class="dialogue-speaker speaker-${(d.speaker || '').toLowerCase().trim()}">${d.speaker}</span>
                <div class="dialogue-bubble">
                  <div class="dialogue-en">${d.en}</div>
                  <div class="dialogue-zh">${d.zh}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      ` : '';

      return `
        <article class="chunk-card ${isStarred ? 'is-starred' : ''}" id="card-${card.id}">
          <div class="card-meta-bar">
            <div class="card-meta-left">
              <span class="card-number-badge">#${String(card.num).padStart(2, '0')}</span>
              <span class="card-category-tag">${card.secTitle.replace(/^[一二三四五六七八九十]+[、.]/, '')}</span>
            </div>
            <button class="btn-star ${isStarred ? 'active' : ''}" onclick="toggleStar(${card.id}, event)" title="加入生词本">
              ${isStarred ? '⭐' : '☆'}
            </button>
          </div>

          <div class="chunk-hero-row" onclick="playChunk(${card.id})" title="点击点读核心词块">
            <div class="chunk-en-title">
              <span class="chunk-en-text">${card.en}</span>
              <span class="chunk-spk-btn">🔊</span>
            </div>
            <div class="chunk-zh-meaning">${card.zh}</div>
          </div>

          ${card.core ? `
            <div class="insight-box insight-core" style="margin-bottom: 12px;">
              <div class="insight-box-title">🧠 先抓核心</div>
              <div>${card.core}</div>
            </div>
          ` : ''}

          ${subchunksHtml ? `
            <div class="subchunks-wrap">
              <div class="examples-header-label">
                <span>🧩 高频词块 · 搭配拓展</span>
              </div>
              <div class="subchunks-list">
                ${subchunksHtml}
              </div>
            </div>
          ` : ''}

          ${dialogueHtml}

          ${card.warn ? `
            <div class="warn-box" style="margin-top: 12px;">
              <div class="warn-title">⚠️ 容易弄错</div>
              <div>${card.warn}</div>
            </div>
          ` : ''}
        </article>
      `;
    }

    window.playSubChunk = function(cardId, scIdx, event) {
      if (event) event.stopPropagation();
      const card = window.CURRENT_DB.cards.find(c => c.id === cardId);
      if (!card || !card.chunks || !card.chunks[scIdx]) return;
      const sc = card.chunks[scIdx];

      player.clearPlayingUI();
      const scEl = document.getElementById(`sc-${cardId}-${scIdx}`);
      if (scEl) scEl.classList.add('is-speaking');

      player.playItem({
        en: sc.en,
        zh: sc.zh,
        localAudio: sc.localAudio
      });
    };

    window.playDialogue = function(cardId, event) {
      if (event) event.stopPropagation();
      const card = window.CURRENT_DB.cards.find(c => c.id === cardId);
      if (!card || !card.dialogueLocal) return;

      player.clearPlayingUI();
      const cardEl = document.getElementById(`card-${cardId}`);
      if (cardEl) cardEl.classList.add('is-speaking');

      player.playItem({
        en: `${card.en} - 对话实战`,
        zh: card.zh,
        localAudio: card.dialogueLocal
      });
    };


    // Play action
    window.playChunk = function(cardId, event) {
      if (event) event.stopPropagation();
      const card = window.CURRENT_DB.cards.find(c => c.id === cardId);
      if (!card) return;

      player.clearPlayingUI();
      const cardEl = document.getElementById(`card-${cardId}`);
      if (cardEl) cardEl.classList.add('is-speaking');

      player.playItem({
        en: card.en,
        zh: card.zh,
        localAudio: card.chunkLocal
      });
    };

    window.toggleStar = function(cardId, event) {
      if (event) event.stopPropagation();
      if (starredIds.has(cardId)) {
        starredIds.delete(cardId);
      } else {
        starredIds.add(cardId);
      }

      try {
        localStorage.setItem(STAR_STORAGE_KEY, JSON.stringify([...starredIds]));
      } catch(e) {}

      renderCards();
    };

    function updateBottomPlayer(item) {
      nowPlayingEn.textContent = item.en;
      nowPlayingZh.textContent = item.zh || '';
      bottomPlayerBar.classList.add('active');
      btnPlayPause.textContent = '⏸ 暂停';
    }

    function bindEvents() {
      // Theme Switcher
      const themeBtn = document.getElementById('btnThemeToggle');
      if (themeBtn) themeBtn.onclick = toggleTheme;

      // Font Sizing
      btnFontDec.onclick = () => {
        if (fontScaleIdx > 0) {
          fontScaleIdx--;
          document.documentElement.style.setProperty('--base-size', fontScales[fontScaleIdx].size);
          fontLabel.textContent = fontScales[fontScaleIdx].label;
        }
      };
      btnFontInc.onclick = () => {
        if (fontScaleIdx < fontScales.length - 1) {
          fontScaleIdx++;
          document.documentElement.style.setProperty('--base-size', fontScales[fontScaleIdx].size);
          fontLabel.textContent = fontScales[fontScaleIdx].label;
        }
      };

      // Speed Toggle
      btnSpeedToggle.onclick = () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        currentSpeed = speeds[speedIdx];
        speedLabel.textContent = `${currentSpeed.toFixed(1)}x`;
        player.audio.playbackRate = currentSpeed;
      };

      // Mask Mode Toggle
      btnMaskToggle.onclick = () => {
        maskIdx = (maskIdx + 1) % maskModes.length;
        const mode = maskModes[maskIdx];
        maskLabel.textContent = mode.label;
        document.body.classList.remove('mask-en', 'mask-zh');
        if (mode.id === 'en') document.body.classList.add('mask-en');
        if (mode.id === 'zh') document.body.classList.add('mask-zh');
        btnMaskToggle.classList.toggle('active', mode.id !== 'none');
      };

      // Star Filter
      btnStarFilter.onclick = () => {
        onlyStarred = !onlyStarred;
        btnStarFilter.classList.toggle('active', onlyStarred);
        starFilterLabel.textContent = onlyStarred ? `已收藏 (${starredIds.size})` : '生词本';
        renderCards();
      };

      // Search Filter
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        btnClearSearch.style.display = searchQuery ? 'block' : 'none';
        renderCards();
      };
      btnClearSearch.onclick = () => {
        searchInput.value = '';
        searchQuery = '';
        btnClearSearch.style.display = 'none';
        renderCards();
      };

      // Section Pill Clicks
      sectionPillBar.onclick = (e) => {
        const btn = e.target.closest('.sec-pill');
        if (!btn) return;
        const secVal = btn.dataset.sec;
        activeSection = secVal === 'all' ? null : parseInt(secVal);
        renderSectionPills();
        renderCards();
      };

      // Bottom Player Controls
      btnPlayPause.onclick = () => {
        if (player.audio.paused) {
          if (loopItem) {
            player.playItem(loopItem);
          }
        } else {
          player.audio.pause();
          btnPlayPause.textContent = '▶ 播放';
          player.clearPlayingUI();
        }
      };

      btnLoopToggle.onclick = () => {
        isLooping = !isLooping;
        btnLoopToggle.classList.toggle('loop-on', isLooping);
        btnLoopToggle.textContent = isLooping ? '🔂 正在循环' : '🔁 单曲循环';
      };

      btnClosePlayer.onclick = () => {
        player.stop();
        bottomPlayerBar.classList.remove('active');
        player.clearPlayingUI();
      };

      // Card Navigation Prev / Next
      document.getElementById('btnPrevCard').onclick = () => {
        if (!loopItem) return;
        const cards = window.CURRENT_DB.cards;
        const curIdx = cards.findIndex(c => c.en === loopItem.en || (c.examples && c.examples.some(ex => ex.en === loopItem.en)));
        if (curIdx > 0) {
          playChunk(cards[curIdx - 1].id);
        }
      };

      document.getElementById('btnNextCard').onclick = () => {
        if (!loopItem) return;
        const cards = window.CURRENT_DB.cards;
        const curIdx = cards.findIndex(c => c.en === loopItem.en || (c.examples && c.examples.some(ex => ex.en === loopItem.en)));
        if (curIdx >= 0 && curIdx < cards.length - 1) {
          playChunk(cards[curIdx + 1].id);
        }
      };
    }

    init();
  </script>
</body>
</html>
