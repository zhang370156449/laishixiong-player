    function renderSectionPills() {
      const sections = window.CURRENT_DB.sections;
      let html = `<button class="sec-pill ${activeSection === null ? 'active' : ''}" data-sec="all">全部 (${window.CURRENT_DB.cards.length})</button>`;

      sections.forEach(s => {
        html += `<button class="sec-pill ${activeSection === s.secIdx ? 'active' : ''}" data-sec="${s.secIdx}">${s.title} (${s.count})</button>`;
      });

      sectionPillBar.innerHTML = html;
    }

    function renderCards() {
      const sections = window.CURRENT_DB.sections;
      const allCards = window.CURRENT_DB.cards;

      let renderedSectionCount = 0;
      let totalRenderedCards = 0;
      let html = '';

      sections.forEach(sec => {
        if (activeSection !== null && sec.secIdx !== activeSection) return;

        const matchingCards = allCards.filter(c => {
          if (c.secIdx !== sec.secIdx) return false;
          if (onlyStarred && !starredIds.has(c.id)) return false;
          if (searchQuery) {
            const q = searchQuery;
            const inEn = (c.en || '').toLowerCase().includes(q);
            const inZh = (c.zh || '').toLowerCase().includes(q);
            const inCore = (c.core || '').toLowerCase().includes(q);
            const inUsage = (c.usage || '').toLowerCase().includes(q);
            const inWarn = (c.warn || '').toLowerCase().includes(q);
            const inEx = (c.examples || []).some(ex => (ex.en || '').toLowerCase().includes(q) || (ex.zh || '').toLowerCase().includes(q));
            const inChunks = (c.chunks || []).some(sc => (sc.en || '').toLowerCase().includes(q) || (sc.zh || '').toLowerCase().includes(q));
            const inDial = (c.dialogue || []).some(d => (d.en || '').toLowerCase().includes(q) || (d.zh || '').toLowerCase().includes(q));
            if (!inEn && !inZh && !inCore && !inUsage && !inWarn && !inEx && !inChunks && !inDial) return false;
          }
          return true;
        });

        if (matchingCards.length === 0) return;

        renderedSectionCount++;
        totalRenderedCards += matchingCards.length;

        html += `
          <section class="section-block" id="section-block-${sec.secIdx}">
            <div class="section-header-banner">
              <div>
                <h2>${sec.title}</h2>
                ${sec.intro ? `<p class="section-intro-text">${sec.intro}</p>` : ''}
              </div>
              <span class="section-badge-count">${matchingCards.length} 项</span>
            </div>

            <div class="cards-grid">
              ${matchingCards.map(c => renderSingleCard(c)).join('')}
            </div>
          </section>
        `;
      });

      if (totalRenderedCards === 0) {
        html = `
          <div style="text-align:center; padding: 60px 20px; color: #94a3b8;">
            <div style="font-size: 3rem; margin-bottom: 12px;">🔍</div>
            <h3 style="font-size: 1.2rem; color: #475569; margin-bottom: 6px;">没有找到符合条件的内容</h3>
            <p style="font-size: 0.9rem;">请尝试更换搜索关键词，或者重置生词本筛选条件</p>
          </div>
        `;
      }

      mainContainer.innerHTML = html;
      document.getElementById('totalCardBadge').textContent = `${totalRenderedCards} 词块`;
    }

    
    function renderSingleCard(card) {
      const isStarred = starredIds.has(card.id);

      const examplesHtml = (card.examples || []).map((ex, idx) => `
        <div class="sentence-card" id="sent-${card.id}-${idx}">
          <div class="sentence-content" onclick="playSentence(${card.id}, ${idx})">
            <div class="sentence-en">${ex.en}</div>
            <div class="sentence-zh">${ex.zh}</div>
          </div>
          <div class="sentence-actions">
            <button class="btn-audio-play" onclick="playSentence(${card.id}, ${idx}, event)" title="点击发音">
              ▶
            </button>
          </div>
        </div>
      `).join('');

      return `
        <article class="chunk-card ${isStarred ? 'is-starred' : ''}" id="card-${card.id}">
          <div class="card-meta-bar">
            <div class="card-meta-left">
              <span class="card-number-badge">#${String(card.num).padStart(2, '0')}</span>
              <span class="card-category-tag">${card.secTitle.replace(/^[一二三四五六七八九十]+[、.]/, '')}</span>
            </div>
            <button class="btn-star ${isStarred ? 'active' : ''}" onclick="toggleStar(${card.id}, event)" title="加入生词本">
              ${isStarred ? '⭐' : '☆'}
            </button>
          </div>

          <div class="chunk-hero-row" onclick="playChunk(${card.id})" title="点击点读核心词块">
            <div class="chunk-en-title">
              <span class="chunk-en-text">${card.en}</span>
              <span class="chunk-spk-btn">🔊</span>
            </div>
            <div class="chunk-zh-meaning">${card.zh}</div>
          </div>

          <!-- Core & Usage Insights -->
          ${(card.core || card.usage) ? `
            <div class="card-insights-row">
              ${card.core ? `
                <div class="insight-box insight-core">
                  <div class="insight-box-title">🧠 先抓核心</div>
                  <div>${card.core}</div>
                </div>
              ` : ''}
              ${card.usage ? `
                <div class="insight-box insight-usage">
                  <div class="insight-box-title">🧩 怎么套用</div>
                  <div>${card.usage}</div>
                </div>
              ` : ''}
            </div>
          ` : ''}

          <!-- Speaking Examples -->
          ${examplesHtml ? `
            <div class="examples-wrap">
              <div class="examples-header-label">
                <span>💬 开口例句 · 逐句点读</span>
              </div>
              <div class="examples-list">
                ${examplesHtml}
              </div>
            </div>
          ` : ''}

          <!-- Common Pitfalls -->
          ${card.warn ? `
            <div class="warn-box">
              <div class="warn-title">⚠️ 容易弄错</div>
              <div>${card.warn}</div>
            </div>
          ` : ''}
        </article>
      `;
    }

    window.playSentence = function(cardId, sentIdx, event) {
      if (event) event.stopPropagation();
      const card = window.CURRENT_DB.cards.find(c => c.id === cardId);
      if (!card || !card.examples || !card.examples[sentIdx]) return;
      const ex = card.examples[sentIdx];

      player.clearPlayingUI();
      const sentEl = document.getElementById(`sent-${cardId}-${sentIdx}`);
      if (sentEl) sentEl.classList.add('is-speaking');

      player.playItem({
        en: ex.en,
        zh: ex.zh,
        localAudio: ex.localAudio
      });
    };


    // Play action
    window.playChunk = function(cardId, event) {
      if (event) event.stopPropagation();
      const card = window.CURRENT_DB.cards.find(c => c.id === cardId);
      if (!card) return;

      player.clearPlayingUI();
      const cardEl = document.getElementById(`card-${cardId}`);
      if (cardEl) cardEl.classList.add('is-speaking');

      player.playItem({
        en: card.en,
        zh: card.zh,
        localAudio: card.chunkLocal
      });
    };

    window.toggleStar = function(cardId, event) {
      if (event) event.stopPropagation();
      if (starredIds.has(cardId)) {
        starredIds.delete(cardId);
      } else {
        starredIds.add(cardId);
      }

      try {
        localStorage.setItem(STAR_STORAGE_KEY, JSON.stringify([...starredIds]));
      } catch(e) {}

      renderCards();
    };

    function updateBottomPlayer(item) {
      nowPlayingEn.textContent = item.en;
      nowPlayingZh.textContent = item.zh || '';
      bottomPlayerBar.classList.add('active');
      btnPlayPause.textContent = '⏸ 暂停';
    }

    function bindEvents() {
      // Theme Switcher
      const themeBtn = document.getElementById('btnThemeToggle');
      if (themeBtn) themeBtn.onclick = toggleTheme;

      // Font Sizing
      btnFontDec.onclick = () => {
        if (fontScaleIdx > 0) {
          fontScaleIdx--;
          document.documentElement.style.setProperty('--base-size', fontScales[fontScaleIdx].size);
          fontLabel.textContent = fontScales[fontScaleIdx].label;
        }
      };
      btnFontInc.onclick = () => {
        if (fontScaleIdx < fontScales.length - 1) {
          fontScaleIdx++;
          document.documentElement.style.setProperty('--base-size', fontScales[fontScaleIdx].size);
          fontLabel.textContent = fontScales[fontScaleIdx].label;
        }
      };

      // Speed Toggle
      btnSpeedToggle.onclick = () => {
        speedIdx = (speedIdx + 1) % speeds.length;
        currentSpeed = speeds[speedIdx];
        speedLabel.textContent = `${currentSpeed.toFixed(1)}x`;
        player.audio.playbackRate = currentSpeed;
      };

      // Mask Mode Toggle
      btnMaskToggle.onclick = () => {
        maskIdx = (maskIdx + 1) % maskModes.length;
        const mode = maskModes[maskIdx];
        maskLabel.textContent = mode.label;
        document.body.classList.remove('mask-en', 'mask-zh');
        if (mode.id === 'en') document.body.classList.add('mask-en');
        if (mode.id === 'zh') document.body.classList.add('mask-zh');
        btnMaskToggle.classList.toggle('active', mode.id !== 'none');
      };

      // Star Filter
      btnStarFilter.onclick = () => {
        onlyStarred = !onlyStarred;
        btnStarFilter.classList.toggle('active', onlyStarred);
        starFilterLabel.textContent = onlyStarred ? `已收藏 (${starredIds.size})` : '生词本';
        renderCards();
      };

      // Search Filter
      searchInput.oninput = (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        btnClearSearch.style.display = searchQuery ? 'block' : 'none';
        renderCards();
      };
      btnClearSearch.onclick = () => {
        searchInput.value = '';
        searchQuery = '';
        btnClearSearch.style.display = 'none';
        renderCards();
      };

      // Section Pill Clicks
      sectionPillBar.onclick = (e) => {
        const btn = e.target.closest('.sec-pill');
        if (!btn) return;
        const secVal = btn.dataset.sec;
        activeSection = secVal === 'all' ? null : parseInt(secVal);
        renderSectionPills();
        renderCards();
      };

      // Bottom Player Controls
      btnPlayPause.onclick = () => {
        if (player.audio.paused) {
          if (loopItem) {
            player.playItem(loopItem);
          }
        } else {
          player.audio.pause();
          btnPlayPause.textContent = '▶ 播放';
          player.clearPlayingUI();
        }
      };

      btnLoopToggle.onclick = () => {
        isLooping = !isLooping;
        btnLoopToggle.classList.toggle('loop-on', isLooping);
        btnLoopToggle.textContent = isLooping ? '🔂 正在循环' : '🔁 单曲循环';
      };

      btnClosePlayer.onclick = () => {
        player.stop();
        bottomPlayerBar.classList.remove('active');
        player.clearPlayingUI();
      };

      // Card Navigation Prev / Next
      document.getElementById('btnPrevCard').onclick = () => {
        if (!loopItem) return;
        const cards = window.CURRENT_DB.cards;
        const curIdx = cards.findIndex(c => c.en === loopItem.en || (c.examples && c.examples.some(ex => ex.en === loopItem.en)));
        if (curIdx > 0) {
          playChunk(cards[curIdx - 1].id);
        }
      };

      document.getElementById('btnNextCard').onclick = () => {
        if (!loopItem) return;
        const cards = window.CURRENT_DB.cards;
        const curIdx = cards.findIndex(c => c.en === loopItem.en || (c.examples && c.examples.some(ex => ex.en === loopItem.en)));
        if (curIdx >= 0 && curIdx < cards.length - 1) {
          playChunk(cards[curIdx + 1].id);
        }
      };
    }

    init();
  </script>
</body>
</html>
