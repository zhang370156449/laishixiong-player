usage": "Are you from around here?", "warn": "问路或找餐厅前极高频的破冰句。", "examples": [{"en": "Are you from around here?", "zh": "你是这附近的人吗？", "audio": "s4_5_s0_Are_you_from_around_here.mp3", "localAudio": "audio_chunks/s4_5_s0_Are_you_from_around_here.mp3"}, {"en": "I'm not from around here.", "zh": "我不是本地人。", "audio": "daily_087_ex1_not_around_here.mp3", "localAudio": "audio_chunks/daily_087_ex1_not_around_here.mp3"}]}, {"id": 88, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "88", "en": "live nearby", "zh": "住在附近", "audioChunk": "s4_5_chunk_nearby.mp3", "chunkLocal": "audio_chunks/s4_5_chunk_nearby.mp3", "core": "聊及通勤距离，或约在离家近的地点见面碰头。", "usage": "live nearby / within walking distance", "warn": "nearby 是副词，不用加 to。", "examples": [{"en": "I live nearby.", "zh": "我就住在附近。", "audio": "s4_5_s1_I_live_nearby.mp3", "localAudio": "audio_chunks/s4_5_s1_I_live_nearby.mp3"}, {"en": "Do you live nearby?", "zh": "你就住在附近吗？", "audio": "daily_088_ex1_live_nearby.mp3", "localAudio": "audio_chunks/daily_088_ex1_live_nearby.mp3"}]}, {"id": 89, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "89", "en": "be here for 原因", "zh": "因为……来到这里", "audioChunk": "s4_6_chunk_be_here_for.mp3", "chunkLocal": "audio_chunks/s4_6_chunk_be_here_for.mp3", "core": "for 后面的内容说明此次出现的目的或原因。", "usage": "后接 work、a meeting、vacation、the event。", "warn": "这里的 for 不是简单翻译为“为了”就结束，要把整块理解为“此次来这里的原因是……”。", "examples": [{"en": "I’m here for work.", "zh": "我是来工作的。", "audio": "s4_6_s0_I_m_here_for_work.mp3", "localAudio": "audio_chunks/s4_6_s0_I_m_here_for_work.mp3"}, {"en": "We’re here for a meeting.", "zh": "我们来这里开会。", "audio": "s4_6_s1_We_re_here_for_a_meeting.mp3", "localAudio": "audio_chunks/s4_6_s1_We_re_here_for_a_meeting.mp3"}]}, {"id": 90, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "90", "en": "be staying at...", "zh": "目前住在……", "audioChunk": "s4_7_chunk_be_staying_at.mp3", "chunkLocal": "audio_chunks/s4_7_chunk_be_staying_at.mp3", "core": "stay 强调暂住，不一定是长期居住。", "usage": "后接 hotel、friend’s place、具体地址。", "warn": "长期固定居住通常用 live，旅行期间暂住用 stay。", "examples": [{"en": "I’m staying at a hotel nearby.", "zh": "我目前住在附近的酒店。", "audio": "s4_7_s0_I_m_staying_at_a_hotel_nearby.mp3", "localAudio": "audio_chunks/s4_7_s0_I_m_staying_at_a_hotel_nearby.mp3"}, {"en": "We’re staying with friends.", "zh": "我们暂住朋友家。", "audio": "s4_7_s1_We_re_staying_with_friends.mp3", "localAudio": "audio_chunks/s4_7_s1_We_re_staying_with_friends.mp3"}]}, {"id": 91, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "91", "en": "...away", "zh": "距离……还有……", "audioChunk": "s4_8_chunk_be_away.mp3", "chunkLocal": "audio_chunks/s4_8_chunk_be_away.mp3", "core": "从当前位置或当前时间到目标之间还有多少距离。", "usage": "ten minutes away、two miles away；可加 from here。", "warn": "中文常省略“距离”，英文用 away 把间隔表达出来。", "examples": [{"en": "It’s about ten minutes away.", "zh": "大约十分钟路程。", "audio": "s4_8_s0_It_s_about_ten_minutes_away.mp3", "localAudio": "audio_chunks/s4_8_s0_It_s_about_ten_minutes_away.mp3"}, {"en": "The hotel is two miles away.", "zh": "酒店在两英里外。", "audio": "s4_8_s1_The_hotel_is_two_miles_away.mp3", "localAudio": "audio_chunks/s4_8_s1_The_hotel_is_two_miles_away.mp3"}]}, {"id": 92, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "92", "en": "down the street", "zh": "沿街不远处", "audioChunk": "s4_9_chunk_down_the_street.mp3", "chunkLocal": "audio_chunks/s4_9_chunk_down_the_street.mp3", "core": "不是严格表示向下，而是沿着当前这条街往前一段距离。", "usage": "常放在地点名词后：the shop down the street。", "warn": "不要机械理解成地势向下。它通常只表示沿着街道不远。", "examples": [{"en": "Have you been to the café down the street?", "zh": "你去过街道不远处的咖啡馆吗？", "audio": "s4_9_s0_Have_you_been_to_the_caf_down_the_street.mp3", "localAudio": "audio_chunks/s4_9_s0_Have_you_been_to_the_caf_down_the_street.mp3"}, {"en": "There’s a store down the street.", "zh": "沿街不远有家商店。", "audio": "s4_9_s1_There_s_a_store_down_the_street.mp3", "localAudio": "audio_chunks/s4_9_s1_There_s_a_store_down_the_street.mp3"}]}, {"id": 93, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "93", "en": "run out of...", "zh": "用完了、耗尽了（强调动作过程）", "audioChunk": "s4_10_chunk_run_out_of.mp3", "chunkLocal": "audio_chunks/s4_10_chunk_run_out_of.mp3", "core": "某项资源从有到无被消耗完毕的动态过程。", "usage": "run out of time / paper / budget", "warn": "开会时间不够说 We're running out of time。", "examples": [{"en": "We’ve run out of milk.", "zh": "我们的牛奶用完了。", "audio": "s4_10_s0_We_ve_run_out_of_milk.mp3", "localAudio": "audio_chunks/s4_10_s0_We_ve_run_out_of_milk.mp3"}, {"en": "We ran out of shampoo bottles.", "zh": "我们的洗发水瓶子用完了。", "audio": "beauty_093_ex1_shampoo_bottles.mp3", "localAudio": "audio_chunks/beauty_093_ex1_shampoo_bottles.mp3"}]}, {"id": 94, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "94", "en": "be out of...", "zh": "处于没有状态、断供", "audioChunk": "s4_10_chunk_be_out_of.mp3", "chunkLocal": "audio_chunks/s4_10_chunk_be_out_of.mp3", "core": "静态描述当前手头已经没有某物可用。", "usage": "be out of supplies / stock / coffee", "warn": "茶水间或储物柜空了时用 be out of。", "examples": [{"en": "We’re out of paper bags.", "zh": "我们的纸袋用完了。", "audio": "s4_10_s1_We_re_out_of_paper_bags.mp3", "localAudio": "audio_chunks/s4_10_s1_We_re_out_of_paper_bags.mp3"}, {"en": "Are you out of lipstick boxes?", "zh": "你们口红包装盒用完了吗？", "audio": "beauty_094_ex1_lipstick_boxes.mp3", "localAudio": "audio_chunks/beauty_094_ex1_lipstick_boxes.mp3"}]}, {"id": 95, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "95", "en": "get used to...", "zh": "逐渐习惯、慢慢适应（强调适应过程）", "audioChunk": "daily_split_095_get_used_to.mp3", "chunkLocal": "audio_chunks/daily_split_095_get_used_to.mp3", "core": "强调从不习惯到习惯的动态适应过程。", "usage": "get used to + 名词 / 动名词-ing", "warn": "经常用于现在进行时，如 I'm getting used to...", "examples": [{"en": "I’m getting used to the new job.", "zh": "我正在慢慢适应这份新工作。", "audio": "s4_11_s0_I_m_getting_used_to_the_new_job.mp3", "localAudio": "audio_chunks/s4_11_s0_I_m_getting_used_to_the_new_job.mp3"}, {"en": "You'll get used to testing formulas.", "zh": "你很快就会习惯测试配方的。", "audio": "beauty_095_ex1_testing_formulas.mp3", "localAudio": "audio_chunks/beauty_095_ex1_testing_formulas.mp3"}]}, {"id": 96, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "96", "en": "be used to...", "zh": "已经习惯于……（已经处于适应状态）", "audioChunk": "daily_split_096_be_used_to.mp3", "chunkLocal": "audio_chunks/daily_split_096_be_used_to.mp3", "core": "静态描述当前已经对某种环境或做法习以为常，不觉得陌生或吃力。", "usage": "be used to + 名词 / 动名词-ing", "warn": "to 是介词，后面千万不能接动词原形，必须接 -ing 或名词。", "examples": [{"en": "I’m used to working late.", "zh": "我已经习惯熬夜加班了。", "audio": "s4_11_s1_I_m_used_to_working_late.mp3", "localAudio": "audio_chunks/s4_11_s1_I_m_used_to_working_late.mp3"}, {"en": "Our team is used to OEM orders.", "zh": "我们团队早已习惯承接OEM订单了。", "audio": "beauty_096_ex1_oem_orders.mp3", "localAudio": "audio_chunks/beauty_096_ex1_oem_orders.mp3"}]}, {"id": 97, "secIdx": 5, "secTitle": "五、状态、位置与变化", "num": "97", "en": "be responsible for...", "zh": "负责……", "audioChunk": "s4_12_chunk_be_responsible_for.mp3", "chunkLocal": "audio_chunks/s4_12_chunk_be_responsible_for.mp3", "core": "表示某件事属于自己的职责范围。", "usage": "for 后接名词或动词 -ing。", "warn": "不能说 responsible to do 来表达日常职责，优先用 for + -ing。", "examples": [{"en": "I’m responsible for overseas sales.", "zh": "我负责海外销售。", "audio": "s4_12_s0_I_m_responsible_for_overseas_sales.mp3", "localAudio": "audio_chunks/s4_12_s0_I_m_responsible_for_overseas_sales.mp3"}, {"en": "She is responsible for checking orders.", "zh": "她负责核对订单。", "audio": "s4_12_s1_She_is_responsible_for_checking_orders.mp3", "localAudio": "audio_chunks/s4_12_s1_She_is_responsible_for_checking_orders.mp3"}]}, {"id": 98, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "98", "en": "prefer A to B", "zh": "比起B更喜欢A", "audioChunk": "s5_1_chunk_prefer_A_to_B.mp3", "chunkLocal": "audio_chunks/s5_1_chunk_prefer_A_to_B.mp3", "core": "把A放在更优先的位置，B是比较对象。", "usage": "prefer 后接两个名词或两个同类动作，中间用 to。", "warn": "不要说 prefer A than B。比较连接词是 to。", "examples": [{"en": "I prefer tea to coffee.", "zh": "比起咖啡我更喜欢茶。", "audio": "s5_1_s0_I_prefer_tea_to_coffee.mp3", "localAudio": "audio_chunks/s5_1_s0_I_prefer_tea_to_coffee.mp3"}, {"en": "I prefer paying by card to using cash.", "zh": "比起现金，我更喜欢刷卡。", "audio": "s5_1_s1_I_prefer_paying_by_card_to_using_cash.mp3", "localAudio": "audio_chunks/s5_1_s1_I_prefer_paying_by_card_to_using_cash.mp3"}]}, {"id": 99, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "99", "en": "would rather...", "zh": "宁愿做……", "audioChunk": "s5_2_chunk_would_rather.mp3", "chunkLocal": "audio_chunks/s5_2_chunk_would_rather.mp3", "core": "表达当前具体选择，重点是“如果让我选，我会选这个动作”。", "usage": "would rather 后直接接动词原形；比较时用 than。", "warn": "不要在动词前加 to：说 would rather wait。", "examples": [{"en": "I’d rather wait a little longer.", "zh": "我宁愿再等一会儿。", "audio": "s5_2_s0_I_d_rather_wait_a_little_longer.mp3", "localAudio": "audio_chunks/s5_2_s0_I_d_rather_wait_a_little_longer.mp3"}, {"en": "I’d rather pay by card than use cash.", "zh": "我宁愿刷卡也不想用现金。", "audio": "s5_2_s1_I_d_rather_pay_by_card_than_use_cash.mp3", "localAudio": "audio_chunks/s5_2_s1_I_d_rather_pay_by_card_than_use_cash.mp3"}]}, {"id": 100, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "100", "en": "either A or B", "zh": "A或B、两个都可以任选", "audioChunk": "s5_3_chunk_either_A_or_B.mp3", "chunkLocal": "audio_chunks/s5_3_chunk_either_A_or_B.mp3", "core": "either...or... 提供两个可能；either one 表示两者任意一个都能接受。", "usage": "A和B尽量保持相同语法形式。", "warn": "either 指两者中的任意一个；三个以上通常用 any one。", "examples": [{"en": "You can pay by cash or card.", "zh": "你可以用现金或卡。", "audio": "s5_3_s0_You_can_pay_by_cash_or_card.mp3", "localAudio": "audio_chunks/s5_3_s0_You_can_pay_by_cash_or_card.mp3"}, {"en": "Either one is fine with me.", "zh": "哪个都可以。", "audio": "s5_3_s1_Either_one_is_fine_with_me.mp3", "localAudio": "audio_chunks/s5_3_s1_Either_one_is_fine_with_me.mp3"}]}, {"id": 101, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "101", "en": "both A and B", "zh": "A和B两者都……（两者兼备）", "audioChunk": "s5_4_chunk_both.mp3", "chunkLocal": "audio_chunks/s5_4_chunk_both.mp3", "core": "将两个对象同时涵盖进来，强调两方面都要或都符合条件。", "usage": "both + A + and + B", "warn": "作主语时谓语动词用复数。", "examples": [{"en": "We need both the order number and the batch number.", "zh": "我们需要订单号和生产批次号。", "audio": "s5_4_s0_We_need_both_the_order_number_and_the_batch_number.mp3", "localAudio": "audio_chunks/s5_4_s0_We_need_both_the_order_number_and_the_batch_number.mp3"}, {"en": "This lotion is both gentle and hydrating.", "zh": "这款乳液既温和又补水保湿。", "audio": "beauty_101_ex1_gentle_hydrating.mp3", "localAudio": "audio_chunks/beauty_101_ex1_gentle_hydrating.mp3"}]}, {"id": 102, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "102", "en": "either A or B", "zh": "要么A要么B、二选一（两者任选其一）", "audioChunk": "s5_4_chunk_either.mp3", "chunkLocal": "audio_chunks/s5_4_chunk_either.mp3", "core": "在两个选项之间做出选择，二者居其一即可满足条件。", "usage": "either + A + or + B", "warn": "就近一致原则；表示二选一都可以。", "examples": [{"en": "The product is both gentle and effective.", "zh": "该产品既温和又见效好。", "audio": "s5_4_s1_The_product_is_both_gentle_and_effective.mp3", "localAudio": "audio_chunks/s5_4_s1_The_product_is_both_gentle_and_effective.mp3"}, {"en": "Choose either frosted or clear glass.", "zh": "你可以选磨砂玻璃或透明玻璃。", "audio": "beauty_102_ex1_frosted_clear.mp3", "localAudio": "audio_chunks/beauty_102_ex1_frosted_clear.mp3"}]}, {"id": 103, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "103", "en": "instead of...", "zh": "用……代替、而不是……", "audioChunk": "s5_5_chunk_instead_of.mp3", "chunkLocal": "audio_chunks/s5_5_chunk_instead_of.mp3", "core": "选择前面的内容，排除后面的原方案。", "usage": "instead of 后接名词、代词或动词 -ing。", "warn": "不要在介词后直接接动词原形：说 instead of waiting。", "examples": [{"en": "Can I get salad instead of fries?", "zh": "可以用沙拉换薯条吗？", "audio": "s5_5_s0_Can_I_get_salad_instead_of_fries.mp3", "localAudio": "audio_chunks/s5_5_s0_Can_I_get_salad_instead_of_fries.mp3"}, {"en": "Let’s call instead of texting.", "zh": "我们打电话吧，不发信息了。", "audio": "s5_5_s1_Let_s_call_instead_of_texting.mp3", "localAudio": "audio_chunks/s5_5_s1_Let_s_call_instead_of_texting.mp3"}]}, {"id": 104, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "104", "en": "be different from...", "zh": "与……不同", "audioChunk": "s5_6_chunk_be_different_from.mp3", "chunkLocal": "audio_chunks/s5_6_chunk_be_different_from.mp3", "core": "指出两个对象不相同，既可说价格，也可说外观、规则或情况。", "usage": "different from 后接比较对象。", "warn": "美式口语偶尔听到 different than，零基础阶段优先掌握最通用的 different from。", "examples": [{"en": "The shelf price is different from the price at the register.", "zh": "货架价和收银价不同。", "audio": "s5_6_s0_The_shelf_price_is_different_from_the_price_at_the_register.mp3", "localAudio": "audio_chunks/s5_6_s0_The_shelf_price_is_different_from_the_price_at_the_register.mp3"}, {"en": "This version is different from the old one.", "zh": "这个版本和旧版不同。", "audio": "s5_6_s1_This_version_is_different_from_the_old_one.mp3", "localAudio": "audio_chunks/s5_6_s1_This_version_is_different_from_the_old_one.mp3"}]}, {"id": 105, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "105", "en": "be the same as...", "zh": "与……相同", "audioChunk": "s5_7_chunk_be_the_same_as.mp3", "chunkLocal": "audio_chunks/s5_7_chunk_be_the_same_as.mp3", "core": "说明两个对象在相关方面一致。", "usage": "the same as 固定，后接比较对象。", "warn": "不要说 the same with 来作普通比较。", "examples": [{"en": "Is this the same as the one online?", "zh": "这和网上的是同一款吗？", "audio": "s5_7_s0_Is_this_the_same_as_the_one_online.mp3", "localAudio": "audio_chunks/s5_7_s0_Is_this_the_same_as_the_one_online.mp3"}, {"en": "The price is the same as before.", "zh": "价格和以前一样。", "audio": "s5_7_s1_The_price_is_the_same_as_before.mp3", "localAudio": "audio_chunks/s5_7_s1_The_price_is_the_same_as_before.mp3"}]}, {"id": 106, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "106", "en": "depend on 条件", "zh": "取决于……", "audioChunk": "s5_8_chunk_depend_on.mp3", "chunkLocal": "audio_chunks/s5_8_chunk_depend_on.mp3", "core": "结果不是固定的，要等某个条件确定后才能回答。", "usage": "depend on 后接 price、quantity、weather、what you need。", "warn": "单独说 It depends. 可以；补充条件时必须保留 on。", "examples": [{"en": "It depends on the price.", "zh": "这取决于价格。", "audio": "s5_8_s0_It_depends_on_the_price.mp3", "localAudio": "audio_chunks/s5_8_s0_It_depends_on_the_price.mp3"}, {"en": "The lead time depends on the quantity.", "zh": "交期取决于数量。", "audio": "s5_8_s1_The_lead_time_depends_on_the_quantity.mp3", "localAudio": "audio_chunks/s5_8_s1_The_lead_time_depends_on_the_quantity.mp3"}]}, {"id": 107, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "107", "en": "enough to...", "zh": "足够……", "audioChunk": "s5_9_chunk_be_enough_to_enough_for.mp3", "chunkLocal": "audio_chunks/s5_9_chunk_be_enough_to_enough_for.mp3", "core": "表示数量或程度达到完成某事的门槛。", "usage": "形容词后放 enough：big enough；名词前放 enough：enough time。", "warn": "不要说 enough big，应说 big enough。", "examples": [{"en": "The portions are big enough to share.", "zh": "分量足够大，可以分享。", "audio": "s5_9_s0_The_portions_are_big_enough_to_share.mp3", "localAudio": "audio_chunks/s5_9_s0_The_portions_are_big_enough_to_share.mp3"}, {"en": "We have enough time for lunch.", "zh": "我们有足够时间吃午饭。", "audio": "s5_9_s1_We_have_enough_time_for_lunch.mp3", "localAudio": "audio_chunks/s5_9_s1_We_have_enough_time_for_lunch.mp3"}]}, {"id": 108, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "108", "en": "too... to...", "zh": "太……而不能……", "audioChunk": "s5_10_chunk_too_to.mp3", "chunkLocal": "audio_chunks/s5_10_chunk_too_to.mp3", "core": "程度超过了完成后面动作的可接受范围。", "usage": "too + 形容词 + to + 动词原形。", "warn": "中文有时只翻译为“太……了”，但结构里通常包含不能完成的结果。", "examples": [{"en": "It’s too late to change the order.", "zh": "太晚了，无法改订单。", "audio": "s5_10_s0_It_s_too_late_to_change_the_order.mp3", "localAudio": "audio_chunks/s5_10_s0_It_s_too_late_to_change_the_order.mp3"}, {"en": "This is too spicy for me to eat.", "zh": "这个太辣，我吃不了。", "audio": "s5_10_s1_This_is_too_spicy_for_me_to_eat.mp3", "localAudio": "audio_chunks/s5_10_s1_This_is_too_spicy_for_me_to_eat.mp3"}]}, {"id": 109, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "109", "en": "A or B", "zh": "二选一、明确用A替换B", "audioChunk": "s5_11_chunk_A_or_B.mp3", "chunkLocal": "audio_chunks/s5_11_chunk_A_or_B.mp3", "core": "普通 or 只是提出选项；instead of 明确排除B并改选A。", "usage": "两侧使用同类内容。", "warn": "有选择不等于已经做出替代，注意表达意图。", "examples": [{"en": "Cash or card?", "zh": "现金还是刷卡？", "audio": "s5_11_s0_Cash_or_card.mp3", "localAudio": "audio_chunks/s5_11_s0_Cash_or_card.mp3"}, {"en": "Can I pay by card instead of cash?", "zh": "我能不用现金、改为刷卡吗？", "audio": "s5_11_s1_Can_I_pay_by_card_instead_of_cash.mp3", "localAudio": "audio_chunks/s5_11_s1_Can_I_pay_by_card_instead_of_cash.mp3"}]}, {"id": 110, "secIdx": 6, "secTitle": "六、选择、比较、替代与数量", "num": "110", "en": "a couple of...", "zh": "两三个、几个", "audioChunk": "s5_12_chunk_a_couple_of.mp3", "chunkLocal": "audio_chunks/s5_12_chunk_a_couple_of.mp3", "core": "口语中常表示少量，通常接复数名词。", "usage": "a couple of + days、dishes、questions。", "warn": "严格计数时可能指两个；随意口语中也可能只是“少数几个”。", "examples": [{"en": "Could you recommend a couple of dishes?", "zh": "能推荐几个菜吗？", "audio": "s5_12_s0_Could_you_recommend_a_couple_of_dishes.mp3", "localAudio": "audio_chunks/s5_12_s0_Could_you_recommend_a_couple_of_dishes.mp3"}, {"en": "I need a couple of minutes.", "zh": "我需要几分钟。", "audio": "s5_12_s1_I_need_a_couple_of_minutes.mp3", "localAudio": "audio_chunks/s5_12_s1_I_need_a_couple_of_minutes.mp3"}]}, {"id": 111, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "111", "en": "work for...", "zh": "对某人可行、合适", "audioChunk": "s6_1_chunk_work_for.mp3", "chunkLocal": "audio_chunks/s6_1_chunk_work_for.mp3", "core": "work 不一定表示工作；方案、时间或办法作主语时，它表示“能起作用／安排得开”。", "usage": "That/time/plan works for me/us。", "warn": "不要逐字翻译成“为我工作”。", "examples": [{"en": "Seven works for me.", "zh": "七点我可以。", "audio": "s6_1_s0_Seven_works_for_me.mp3", "localAudio": "audio_chunks/s6_1_s0_Seven_works_for_me.mp3"}, {"en": "That plan won’t work for us.", "zh": "那个方案对我们不可行。", "audio": "s6_1_s1_That_plan_won_t_work_for_us.mp3", "localAudio": "audio_chunks/s6_1_s1_That_plan_won_t_work_for_us.mp3"}]}, {"id": 112, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "112", "en": "be fine with...", "zh": "某人可以接受", "audioChunk": "s6_2_chunk_be_fine_with.mp3", "chunkLocal": "audio_chunks/s6_2_chunk_be_fine_with.mp3", "core": "强调本人对某个选择没有异议。", "usage": "A is fine with me；口语也常说 A is fine。", "warn": "fine 在这里不是“罚款”，也不只是“很好”，而是“可以接受”。", "examples": [{"en": "Either one is fine with me.", "zh": "两个我都可以。", "audio": "s6_2_s0_Either_one_is_fine_with_me.mp3", "localAudio": "audio_chunks/s6_2_s0_Either_one_is_fine_with_me.mp3"}, {"en": "Tomorrow is fine with us.", "zh": "明天我们可以。", "audio": "s6_2_s1_Tomorrow_is_fine_with_us.mp3", "localAudio": "audio_chunks/s6_2_s1_Tomorrow_is_fine_with_us.mp3"}]}, {"id": 113, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "113", "en": "I think so", "zh": "我想是的、我认为可行", "audioChunk": "daily_102_I_think_so.mp3", "chunkLocal": "audio_chunks/daily_102_I_think_so.mp3", "core": "日常与职场对话中表达倾向于赞同、肯定或赞成。", "usage": "I think so 作为简短答复", "warn": "不要说 I think yes，地道表达是 I think so。", "examples": [{"en": "Is that right? — I think so.", "zh": "对吗？——我想是的。", "audio": "beauty_short_113_ex0.mp3", "localAudio": "audio_chunks/beauty_short_113_ex0.mp3"}, {"en": "Is the cream ready? — I think so.", "zh": "面霜做好了吗？——我想是的。", "audio": "beauty_short_113_ex1.mp3", "localAudio": "audio_chunks/beauty_short_113_ex1.mp3"}]}, {"id": 114, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "114", "en": "I don't think so", "zh": "我认为不是、恐怕不行", "audioChunk": "daily_103_I_don_t_think_so.mp3", "chunkLocal": "audio_chunks/daily_103_I_don_t_think_so.mp3", "core": "委婉但立场明确地表达否定判断或不同意。", "usage": "I don't think so 作为委婉否定", "warn": "比单纯说 No 更加专业和体面。", "examples": [{"en": "Can we go? — I don't think so.", "zh": "我们能走吗？——我觉得不行。", "audio": "beauty_short_114_ex0.mp3", "localAudio": "audio_chunks/beauty_short_114_ex0.mp3"}, {"en": "Is this mascara waterproof? — I don't think so.", "zh": "这款睫毛膏防水吗？——我想不防水。", "audio": "beauty_short_114_ex1.mp3", "localAudio": "audio_chunks/beauty_short_114_ex1.mp3"}]}, {"id": 115, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "115", "en": "Do you mean...?", "zh": "你指的是……吗？", "audioChunk": "s6_4_chunk_Do_you_mean.mp3", "chunkLocal": "audio_chunks/s6_4_chunk_Do_you_mean.mp3", "core": "不是立刻下结论，而是把自己的理解说出来请对方确认。", "usage": "Do you mean 后接名词、这个/那个，或完整内容。", "warn": "mean 在这里是“所指／想表达”，不是“刻薄的”。", "examples": [{"en": "Do you mean this one?", "zh": "你指这个吗？", "audio": "s6_4_s0_Do_you_mean_this_one.mp3", "localAudio": "audio_chunks/s6_4_s0_Do_you_mean_this_one.mp3"}, {"en": "Do you mean we should wait?", "zh": "你的意思是我们应该等吗？", "audio": "s6_4_s1_Do_you_mean_we_should_wait.mp3", "localAudio": "audio_chunks/s6_4_s1_Do_you_mean_we_should_wait.mp3"}]}, {"id": 116, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "116", "en": "I didn’t catch...", "zh": "我没听清……", "audioChunk": "s6_5_chunk_I_didn_t_catch.mp3", "chunkLocal": "audio_chunks/s6_5_chunk_I_didn_t_catch.mp3", "core": "catch 的画面是声音没有被自己成功接住，因此表示没听清。", "usage": "可说 I didn’t catch that/your name/the last part。", "warn": "它通常不是“没理解思想”，而是声音或信息没有听到；没理解可说 I don’t understand。", "examples": [{"en": "Sorry, I didn’t catch that.", "zh": "抱歉，我没听清。", "audio": "s6_5_s0_Sorry_I_didn_t_catch_that.mp3", "localAudio": "audio_chunks/s6_5_s0_Sorry_I_didn_t_catch_that.mp3"}, {"en": "I didn’t catch your name.", "zh": "我没听清你的名字。", "audio": "s6_5_s1_I_didn_t_catch_your_name.mp3", "localAudio": "audio_chunks/s6_5_s1_I_didn_t_catch_your_name.mp3"}]}, {"id": 117, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "117", "en": "Could you say that again?", "zh": "可以再说一遍吗？", "audioChunk": "s6_6_chunk_Could_you_say_that_again.mp3", "chunkLocal": "audio_chunks/s6_6_chunk_Could_you_say_that_again.mp3", "core": "请求对方重复刚刚说的内容。", "usage": "say that again 整块使用，也可把 that 换成具体内容。", "warn": "again 指重复；如果问题是语速，应改用 speak more slowly。", "examples": [{"en": "Sorry, could you say that again?", "zh": "抱歉，可以再说一遍吗？", "audio": "s6_6_s0_Sorry_could_you_say_that_again.mp3", "localAudio": "audio_chunks/s6_6_s0_Sorry_could_you_say_that_again.mp3"}, {"en": "Could you repeat the number?", "zh": "可以重复一下号码吗？", "audio": "s6_6_s1_Could_you_repeat_the_number.mp3", "localAudio": "audio_chunks/s6_6_s1_Could_you_repeat_the_number.mp3"}]}, {"id": 118, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "118", "en": "speak a little more slowly", "zh": "说慢一点", "audioChunk": "s6_7_chunk_speak_a_little_more_slowly.mp3", "chunkLocal": "audio_chunks/s6_7_chunk_speak_a_little_more_slowly.mp3", "core": "不要求换内容，只要求降低语速。", "usage": "a little 降低请求强度；more slowly 表示比当前更慢。", "warn": "slowly 修饰说话动作；口语中也听到 slower，但学习时用完整形式更稳妥。", "examples": [{"en": "Could you speak a little more slowly?", "zh": "可以说慢一点吗？", "audio": "s6_7_s0_Could_you_speak_a_little_more_slowly.mp3", "localAudio": "audio_chunks/s6_7_s0_Could_you_speak_a_little_more_slowly.mp3"}, {"en": "Please say the number slowly.", "zh": "请慢慢说号码。", "audio": "s6_7_s1_Please_say_the_number_slowly.mp3", "localAudio": "audio_chunks/s6_7_s1_Please_say_the_number_slowly.mp3"}]}, {"id": 119, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "119", "en": "Let me make sure...", "zh": "让我确认一下……", "audioChunk": "s6_8_chunk_Let_me_make_sure.mp3", "chunkLocal": "audio_chunks/s6_8_chunk_Let_me_make_sure.mp3", "core": "先暂停对话，再复述自己的理解，防止双方信息不一致。", "usage": "Let me make sure 后接完整句子；也可说 Let me make sure I understand。", "warn": "不是怀疑对方，而是主动核对自己的理解。", "examples": [{"en": "Let me make sure I understood correctly.", "zh": "让我确认自己理解正确。", "audio": "s6_8_s0_Let_me_make_sure_I_understood_correctly.mp3", "localAudio": "audio_chunks/s6_8_s0_Let_me_make_sure_I_understood_correctly.mp3"}, {"en": "Let me make sure the address is correct.", "zh": "让我确认地址正确。", "audio": "s6_8_s1_Let_me_make_sure_the_address_is_correct.mp3", "localAudio": "audio_chunks/s6_8_s1_Let_me_make_sure_the_address_is_correct.mp3"}]}, {"id": 120, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "120", "en": "show someone...", "zh": "向某人展示……", "audioChunk": "s6_9_chunk_show_what_how.mp3", "chunkLocal": "audio_chunks/s6_9_chunk_show_what_how.mp3", "core": "通过实物、画面或操作让对方理解，适合语言解释困难时。", "usage": "show me/us 后接 what you mean、how it works、the item。", "warn": "show me 后通常不加 to。", "examples": [{"en": "Could you show me what you mean?", "zh": "可以演示一下你的意思吗？", "audio": "s6_9_s0_Could_you_show_me_what_you_mean.mp3", "localAudio": "audio_chunks/s6_9_s0_Could_you_show_me_what_you_mean.mp3"}, {"en": "Please show me how it works.", "zh": "请演示它怎么使用。", "audio": "s6_9_s1_Please_show_me_how_it_works.mp3", "localAudio": "audio_chunks/s6_9_s1_Please_show_me_how_it_works.mp3"}]}, {"id": 121, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "121", "en": "be sorry to hear...", "zh": "听到……感到难过", "audioChunk": "s6_10_chunk_be_sorry_to_hear.mp3", "chunkLocal": "audio_chunks/s6_10_chunk_be_sorry_to_hear.mp3", "core": "对坏消息表达关心，重点是回应对方的经历。", "usage": "sorry to hear 后接 that 小句或具体消息。", "warn": "它不一定承认自己做错了；也可能只是表达同情。", "examples": [{"en": "I’m sorry to hear that.", "zh": "听到这个我很难过。", "audio": "s6_10_s0_I_m_sorry_to_hear_that.mp3", "localAudio": "audio_chunks/s6_10_s0_I_m_sorry_to_hear_that.mp3"}, {"en": "We’re sorry to hear the products arrived damaged.", "zh": "很遗憾产品到货时损坏。", "audio": "s6_10_s1_We_re_sorry_to_hear_the_products_arrived_damaged.mp3", "localAudio": "audio_chunks/s6_10_s1_We_re_sorry_to_hear_the_products_arrived_damaged.mp3"}]}, {"id": 122, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "122", "en": "glad to hear that...", "zh": "很高兴听到……", "audioChunk": "daily_111_glad_to_hear_that.mp3", "chunkLocal": "audio_chunks/daily_111_glad_to_hear_that.mp3", "core": "对他人取得的进展、好消息由衷表达高兴与共情。", "usage": "I'm glad to hear that + 句子", "warn": "职场邮件中回应客户进展顺利的标准句。", "examples": [{"en": "I'm glad to hear that!", "zh": "听到这个我真高兴！", "audio": "beauty_short_122_ex0.mp3", "localAudio": "audio_chunks/beauty_short_122_ex0.mp3"}, {"en": "Glad you loved the samples!", "zh": "很高兴你喜欢这些样品！", "audio": "beauty_short_122_ex1.mp3", "localAudio": "audio_chunks/beauty_short_122_ex1.mp3"}]}, {"id": 123, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "123", "en": "good to hear that...", "zh": "听到这个消息真好", "audioChunk": "daily_112_good_to_hear_that.mp3", "chunkLocal": "audio_chunks/daily_112_good_to_hear_that.mp3", "core": "对顺利进展快速给予肯定，常直接说 That's good to hear!", "usage": "That's good to hear!", "warn": "日常口语快速回应好消息首选。", "examples": [{"en": "That's really good to hear!", "zh": "听到这个真太棒了！", "audio": "beauty_short_123_ex0.mp3", "localAudio": "audio_chunks/beauty_short_123_ex0.mp3"}, {"en": "The bottles passed inspection? Good to hear.", "zh": "瓶子通过质检了？那太好了。", "audio": "beauty_short_123_ex1.mp3", "localAudio": "audio_chunks/beauty_short_123_ex1.mp3"}]}, {"id": 124, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "124", "en": "thanks for...", "zh": "感谢……", "audioChunk": "s6_12_chunk_thanks_for.mp3", "chunkLocal": "audio_chunks/s6_12_chunk_thanks_for.mp3", "core": "for 后说明感谢的具体原因或行为。", "usage": "后接 your help、letting me know、checking。", "warn": "介词 for 后面的动作要用 -ing。", "examples": [{"en": "Thanks for letting me know.", "zh": "谢谢你告诉我。", "audio": "s6_12_s0_Thanks_for_letting_me_know.mp3", "localAudio": "audio_chunks/s6_12_s0_Thanks_for_letting_me_know.mp3"}, {"en": "Thanks for checking with the kitchen.", "zh": "谢谢你向厨房确认。", "audio": "s6_12_s1_Thanks_for_checking_with_the_kitchen.mp3", "localAudio": "audio_chunks/s6_12_s1_Thanks_for_checking_with_the_kitchen.mp3"}]}, {"id": 125, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "125", "en": "appreciate...", "zh": "感谢、重视……", "audioChunk": "s6_13_chunk_appreciate.mp3", "chunkLocal": "audio_chunks/s6_13_chunk_appreciate.mp3", "core": "比普通 thanks 更郑重，强调自己真正重视对方的帮助或付出。", "usage": "可接 your help、your patience，或 you + -ing。", "warn": "通常不说 appreciate for；appreciate 后直接接对象。", "examples": [{"en": "I really appreciate your help.", "zh": "我非常感谢你的帮助。", "audio": "s6_13_s0_I_really_appreciate_your_help.mp3", "localAudio": "audio_chunks/s6_13_s0_I_really_appreciate_your_help.mp3"}, {"en": "We appreciate you checking this.", "zh": "感谢您核查此事。", "audio": "s6_13_s1_We_appreciate_you_checking_this.mp3", "localAudio": "audio_chunks/s6_13_s1_We_appreciate_you_checking_this.mp3"}]}, {"id": 126, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "126", "en": "be happy to...", "zh": "很乐意做……", "audioChunk": "s6_14_chunk_be_happy_to.mp3", "chunkLocal": "audio_chunks/s6_14_chunk_be_happy_to.mp3", "core": "积极接受请求，表示自己愿意提供帮助或参与。", "usage": "am/is/are happy to 后接 help、join、check。", "warn": "不要只理解为情绪“开心”；它常是礼貌表示愿意。", "examples": [{"en": "I’d be happy to help.", "zh": "我很乐意帮忙。", "audio": "s6_14_s0_I_d_be_happy_to_help.mp3", "localAudio": "audio_chunks/s6_14_s0_I_d_be_happy_to_help.mp3"}, {"en": "We’re happy to provide more information.", "zh": "我们很乐意提供更多信息。", "audio": "s6_14_s1_We_re_happy_to_provide_more_information.mp3", "localAudio": "audio_chunks/s6_14_s1_We_re_happy_to_provide_more_information.mp3"}]}, {"id": 127, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "127", "en": "can’t make it", "zh": "无法参加、无法按时到场", "audioChunk": "s6_15_chunk_can_t_make_it.mp3", "chunkLocal": "audio_chunks/s6_15_chunk_can_t_make_it.mp3", "core": "make it 在这里是成功到达或参加，不是“制造它”。", "usage": "可加具体时间：make it tonight、make it by five。", "warn": "根据场景也可能表示“成功做到”，但约会语境通常是“能否到场”。", "examples": [{"en": "Sorry, I can’t make it this time.", "zh": "抱歉，这次我去不了。", "audio": "s6_15_s0_Sorry_I_can_t_make_it_this_time.mp3", "localAudio": "audio_chunks/s6_15_s0_Sorry_I_can_t_make_it_this_time.mp3"}, {"en": "Can you make it by seven?", "zh": "你七点前能到吗？", "audio": "s6_15_s1_Can_you_make_it_by_seven.mp3", "localAudio": "audio_chunks/s6_15_s1_Can_you_make_it_by_seven.mp3"}]}, {"id": 128, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "128", "en": "another time", "zh": "改天、晚一点", "audioChunk": "s6_16_chunk_another_time.mp3", "chunkLocal": "audio_chunks/s6_16_chunk_another_time.mp3", "core": "前者通常推迟到另一个日期或机会；后者只把时间向后移动一点。", "usage": "和 maybe、could we、let’s 搭配。", "warn": "another time 往往不承诺具体新时间；later 仍可能是同一天。", "examples": [{"en": "Maybe another time.", "zh": "改天吧。", "audio": "s6_16_s0_Maybe_another_time.mp3", "localAudio": "audio_chunks/s6_16_s0_Maybe_another_time.mp3"}, {"en": "Could we do it a little later?", "zh": "可以晚一点吗？", "audio": "s6_16_s1_Could_we_do_it_a_little_later.mp3", "localAudio": "audio_chunks/s6_16_s1_Could_we_do_it_a_little_later.mp3"}]}, {"id": 129, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "129", "en": "get back to...", "zh": "在某时回复某人", "audioChunk": "s6_17_chunk_get_back_to.mp3", "chunkLocal": "audio_chunks/s6_17_chunk_get_back_to.mp3", "core": "表示先去确认或思考，然后带着答案回来联系对方。", "usage": "get back to you/us/the client；后加 soon、today、by Friday。", "warn": "不是简单的“回到某人身边”。沟通语境中是“回复”。", "examples": [{"en": "I’ll get back to you soon.", "zh": "我会尽快回复你。", "audio": "s6_17_s0_I_ll_get_back_to_you_soon.mp3", "localAudio": "audio_chunks/s6_17_s0_I_ll_get_back_to_you_soon.mp3"}, {"en": "We’ll get back to the client by Friday.", "zh": "我们最迟周五回复客户。", "audio": "s6_17_s1_We_ll_get_back_to_the_client_by_Friday.mp3", "localAudio": "audio_chunks/s6_17_s1_We_ll_get_back_to_the_client_by_Friday.mp3"}]}, {"id": 130, "secIdx": 7, "secTitle": "七、回复、确认与澄清", "num": "130", "en": "be almost ready", "zh": "差不多准备好了", "audioChunk": "s6_18_chunk_be_almost_ready.mp3", "chunkLocal": "audio_chunks/s6_18_chunk_be_almost_ready.mp3", "core": "表示距离完成只剩很小一步。", "usage": "almost 放在形容词 ready 前。", "warn": "almost 表示尚未完全完成，不等于 already。", "examples": [{"en": "I’m almost ready.", "zh": "我快准备好了。", "audio": "s6_18_s0_I_m_almost_ready.mp3", "localAudio": "audio_chunks/s6_18_s0_I_m_almost_ready.mp3"}, {"en": "The order is almost ready to ship.", "zh": "订单快可以发货了。", "audio": "s6_18_s1_The_order_is_almost_ready_to_ship.mp3", "localAudio": "audio_chunks/s6_18_s1_The_order_is_almost_ready_to_ship.mp3"}]}, {"id": 131, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "131", "en": "be up to...", "zh": "在忙、在做某事", "audioChunk": "s7_1_chunk_be_up_to.mp3", "chunkLocal": "audio_chunks/s7_1_chunk_be_up_to.mp3", "core": "up to 在该语境是固定表达，询问或说明当前活动。", "usage": "常见于 What are you up to?、be up to much。", "warn": "它还有“取决于某人”等其他含义，必须结合句型判断。", "examples": [{"en": "What are you up to this weekend?", "zh": "周末准备做什么？", "audio": "s7_1_s0_What_are_you_up_to_this_weekend.mp3", "localAudio": "audio_chunks/s7_1_s0_What_are_you_up_to_this_weekend.mp3"}, {"en": "I’m not up to much.", "zh": "我没忙什么特别的。", "audio": "s7_1_s1_I_m_not_up_to_much.mp3", "localAudio": "audio_chunks/s7_1_s1_I_m_not_up_to_much.mp3"}]}, {"id": 132, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "132", "en": "get into...", "zh": "开始接触并喜欢上……", "audioChunk": "s7_2_chunk_get_into.mp3", "chunkLocal": "audio_chunks/s7_2_chunk_get_into.mp3", "core": "强调进入一个兴趣、活动或领域的过程。", "usage": "后接 music、skincare、running、the beauty industry。", "warn": "不是简单的物理“进入里面”；对象为兴趣或行业时要整体理解。", "examples": [{"en": "How did you get into that?", "zh": "你怎么开始接触那个的？", "audio": "s7_2_s0_How_did_you_get_into_that.mp3", "localAudio": "audio_chunks/s7_2_s0_How_did_you_get_into_that.mp3"}, {"en": "I got into skincare in college.", "zh": "我大学时开始对护肤感兴趣。", "audio": "s7_2_s1_I_got_into_skincare_in_college.mp3", "localAudio": "audio_chunks/s7_2_s1_I_got_into_skincare_in_college.mp3"}]}, {"id": 133, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "133", "en": "catch up with...", "zh": "和某人叙旧、了解近况", "audioChunk": "s7_3_chunk_catch_up_with.mp3", "chunkLocal": "audio_chunks/s7_3_chunk_catch_up_with.mp3", "core": "和一段时间没深入交流的人互相更新最近发生的事。", "usage": "后接人；动作名词可用 catching up。", "warn": "不是“追赶某人”的唯一含义；社交语境中通常是叙旧。", "examples": [{"en": "It was great catching up with you.", "zh": "和你聊近况很开心。", "audio": "s7_3_s0_It_was_great_catching_up_with_you.mp3", "localAudio": "audio_chunks/s7_3_s0_It_was_great_catching_up_with_you.mp3"}, {"en": "Let’s catch up over coffee.", "zh": "我们找时间喝咖啡聊聊吧。", "audio": "s7_3_s1_Let_s_catch_up_over_coffee.mp3", "localAudio": "audio_chunks/s7_3_s1_Let_s_catch_up_over_coffee.mp3"}]}, {"id": 134, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "134", "en": "grab...", "zh": "简单去吃、喝点……", "audioChunk": "s7_4_chunk_grab.mp3", "chunkLocal": "audio_chunks/s7_4_chunk_grab.mp3", "core": "grab 原本有快速拿取的感觉，口语中常表示随意地去吃喝，不强调正式安排。", "usage": "grab coffee/lunch/a drink。", "warn": "不是要求用手“抓咖啡”，而是轻松随意的邀约。", "examples": [{"en": "Let’s grab a coffee sometime.", "zh": "找时间喝杯咖啡吧。", "audio": "s7_4_s0_Let_s_grab_a_coffee_sometime.mp3", "localAudio": "audio_chunks/s7_4_s0_Let_s_grab_a_coffee_sometime.mp3"}, {"en": "Do you want to grab lunch?", "zh": "想一起吃午饭吗？", "audio": "s7_4_s1_Do_you_want_to_grab_lunch.mp3", "localAudio": "audio_chunks/s7_4_s1_Do_you_want_to_grab_lunch.mp3"}]}, {"id": 135, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "135", "en": "have plans for...", "zh": "在……有安排", "audioChunk": "s7_5_chunk_have_plans_for.mp3", "chunkLocal": "audio_chunks/s7_5_chunk_have_plans_for.mp3", "core": "询问或说明某个时间段是否已经安排活动。", "usage": "后接 the weekend、tonight、tomorrow。", "warn": "plans 常用复数，即使不说明具体安排。", "examples": [{"en": "Got any fun plans for the weekend?", "zh": "周末有什么有趣安排吗？", "audio": "s7_5_s0_Got_any_fun_plans_for_the_weekend.mp3", "localAudio": "audio_chunks/s7_5_s0_Got_any_fun_plans_for_the_weekend.mp3"}, {"en": "I already have plans for tonight.", "zh": "我今晚已经有安排。", "audio": "s7_5_s1_I_already_have_plans_for_tonight.mp3", "localAudio": "audio_chunks/s7_5_s1_I_already_have_plans_for_tonight.mp3"}]}, {"id": 136, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "136", "en": "do anything special", "zh": "做什么特别的事", "audioChunk": "s7_6_chunk_do_anything_special.mp3", "chunkLocal": "audio_chunks/s7_6_chunk_do_anything_special.mp3", "core": "在已有时间或事件背景下，询问是否有值得一提的活动。", "usage": "常和 did、are you going to 搭配。", "warn": "问句中 anything 很自然，不必机械换成 something。", "examples": [{"en": "Did you do anything special?", "zh": "你做什么特别的事了吗？", "audio": "s7_6_s0_Did_you_do_anything_special.mp3", "localAudio": "audio_chunks/s7_6_s0_Did_you_do_anything_special.mp3"}, {"en": "Are you doing anything special this weekend?", "zh": "周末有什么特别安排吗？", "audio": "s7_6_s1_Are_you_doing_anything_special_this_weekend.mp3", "localAudio": "audio_chunks/s7_6_s1_Are_you_doing_anything_special_this_weekend.mp3"}]}, {"id": 137, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "137", "en": "sound...", "zh": "听起来……", "audioChunk": "s7_7_chunk_sound.mp3", "chunkLocal": "audio_chunks/s7_7_chunk_sound.mp3", "core": "根据对方讲述的信息作出判断，主语通常是整件事。", "usage": "可用 sounds great、amazing、difficult、interesting。", "warn": "不用加 to be 才能成立；sound + 形容词 本身就是完整结构。", "examples": [{"en": "That sounds amazing.", "zh": "听起来太棒了。", "audio": "s7_7_s0_That_sounds_amazing.mp3", "localAudio": "audio_chunks/s7_7_s0_That_sounds_amazing.mp3"}, {"en": "The plan sounds good.", "zh": "这个计划听起来不错。", "audio": "s7_7_s1_The_plan_sounds_good.mp3", "localAudio": "audio_chunks/s7_7_s1_The_plan_sounds_good.mp3"}]}, {"id": 138, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "138", "en": "tell me more about...", "zh": "再多说说……", "audioChunk": "s7_8_chunk_tell_me_more_about.mp3", "chunkLocal": "audio_chunks/s7_8_chunk_tell_me_more_about.mp3", "core": "对对方的话题表示兴趣，推动其继续讲。", "usage": "后接 that、your trip、the project。", "warn": "熟人聊天可直接说 Tell me more；客户沟通加 Could you 更礼貌。", "examples": [{"en": "Tell me more about that.", "zh": "再多说说那个吧。", "audio": "s7_8_s0_Tell_me_more_about_that.mp3", "localAudio": "audio_chunks/s7_8_s0_Tell_me_more_about_that.mp3"}, {"en": "Could you tell me more about the product?", "zh": "能多介绍一下产品吗？", "audio": "s7_8_s1_Could_you_tell_me_more_about_the_product.mp3", "localAudio": "audio_chunks/s7_8_s1_Could_you_tell_me_more_about_the_product.mp3"}]}, {"id": 139, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "139", "en": "know what... means", "zh": "明白某人的感受或意思", "audioChunk": "s7_9_chunk_know_what_means.mp3", "chunkLocal": "audio_chunks/s7_9_chunk_know_what_means.mp3", "core": "不仅是理解字面信息，还常表示“我有同感”。", "usage": "常用 I know what you mean。", "warn": "表达共鸣时不需要逐字解释 what 指什么，它代表对方刚才表达的整件事。", "examples": [{"en": "I know what you mean.", "zh": "我懂你的意思／我有同感。", "audio": "s7_9_s0_I_know_what_you_mean.mp3", "localAudio": "audio_chunks/s7_9_s0_I_know_what_you_mean.mp3"}, {"en": "Do you know what I mean?", "zh": "你明白我的意思吗？", "audio": "s7_9_s1_Do_you_know_what_I_mean.mp3", "localAudio": "audio_chunks/s7_9_s1_Do_you_know_what_I_mean.mp3"}]}, {"id": 140, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "140", "en": "must have been...", "zh": "当时一定很……", "audioChunk": "s7_10_chunk_must_have_been.mp3", "chunkLocal": "audio_chunks/s7_10_chunk_must_have_been.mp3", "core": "根据已知信息对过去的感受或状态作有把握的推测。", "usage": "must have been 后接 tough、exciting、stressful。", "warn": "不是表示义务。must 在这里表示说话人的强烈推断。", "examples": [{"en": "That must have been tough.", "zh": "那当时一定很不容易。", "audio": "s7_10_s0_That_must_have_been_tough.mp3", "localAudio": "audio_chunks/s7_10_s0_That_must_have_been_tough.mp3"}, {"en": "It must have been exciting.", "zh": "当时一定很激动。", "audio": "s7_10_s1_It_must_have_been_exciting.mp3", "localAudio": "audio_chunks/s7_10_s1_It_must_have_been_exciting.mp3"}]}, {"id": 141, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "141", "en": "good luck with...", "zh": "祝……顺利", "audioChunk": "s7_11_chunk_good_luck_with.mp3", "chunkLocal": "audio_chunks/s7_11_chunk_good_luck_with.mp3", "core": "祝福对方正在准备或即将面对的具体事情。", "usage": "后接 your presentation、the interview、the project。", "warn": "如果后面是动作，常用 Good luck with + -ing 或改用 Good luck on... 的具体搭配。", "examples": [{"en": "Good luck with your presentation!", "zh": "祝你演示顺利！", "audio": "s7_11_s0_Good_luck_with_your_presentation.mp3", "localAudio": "audio_chunks/s7_11_s0_Good_luck_with_your_presentation.mp3"}, {"en": "Good luck with the new job.", "zh": "祝你新工作顺利。", "audio": "s7_11_s1_Good_luck_with_the_new_job.mp3", "localAudio": "audio_chunks/s7_11_s1_Good_luck_with_the_new_job.mp3"}]}, {"id": 142, "secIdx": 8, "secTitle": "八、社交互动与推进对话", "num": "142", "en": "How about...?", "zh": "……呢？", "audioChunk": "s7_12_chunk_How_about.mp3", "chunkLocal": "audio_chunks/s7_12_chunk_How_about.mp3", "core": "把话题转向另一个人、选项或建议，避免重复完整问句。", "usage": "后接 you、this one、tomorrow；建议动作时可用 How about + -ing。", "warn": "动作要用 -ing，不说 How about meet...。", "examples": [{"en": "I’m from China. How about you?", "zh": "我来自中国，你呢？", "audio": "s7_12_s0_I_m_from_China_How_about_you.mp3", "localAudio": "audio_chunks/s7_12_s0_I_m_from_China_How_about_you.mp3"}, {"en": "How about meeting at seven?", "zh": "七点见怎么样？", "audio": "s7_12_s1_How_about_meeting_at_seven.mp3", "localAudio": "audio_chunks/s7_12_s1_How_about_meeting_at_seven.mp3"}]}, {"id": 143, "secIdx": 9, "secTitle": "九、购物与付款", "num": "143", "en": "look for...", "zh": "寻找……", "audioChunk": "s8_1_chunk_look_for.mp3", "chunkLocal": "audio_chunks/s8_1_chunk_look_for.mp3", "core": "强调自己正在尝试找到目标，不表示已经找到。", "usage": "后接商品、地点、工作或信息。", "warn": "look at 是看着；look for 是寻找；find 是找到的结果。", "examples": [{"en": "I’m looking for something cheaper.", "zh": "我在找便宜一点的。", "audio": "s8_1_s0_I_m_looking_for_something_cheaper.mp3", "localAudio": "audio_chunks/s8_1_s0_I_m_looking_for_something_cheaper.mp3"}, {"en": "Are you looking for anything in particular?", "zh": "你在找某种特定商品吗？", "audio": "s8_1_s1_Are_you_looking_for_anything_in_particular.mp3", "localAudio": "audio_chunks/s8_1_s1_Are_you_looking_for_anything_in_particular.mp3"}]}, {"id": 144, "secIdx": 9, "secTitle": "九、购物与付款", "num": "144", "en": "find... in...", "zh": "在某处找到……", "audioChunk": "s8_2_chunk_find_in_find_on_find_at.mp3", "chunkLocal": "audio_chunks/s8_2_chunk_find_in_find_on_find_at.mp3", "core": "说明目标可以在哪个具体位置被找到。", "usage": "find 后接目标，再用位置短语补充地点。", "warn": "问商品位置时，完整框架 Where can I find...? 比逐词拼接更稳妥。", "examples": [{"en": "You can find it in aisle five.", "zh": "你可以在第五通道找到。", "audio": "s8_2_s0_You_can_find_it_in_aisle_five.mp3", "localAudio": "audio_chunks/s8_2_s0_You_can_find_it_in_aisle_five.mp3"}, {"en": "Where can I find the price?", "zh": "在哪里能看到价格？", "audio": "s8_2_s1_Where_can_I_find_the_price.mp3", "localAudio": "audio_chunks/s8_2_s1_Where_can_I_find_the_price.mp3"}]}, {"id": 145, "secIdx": 9, "secTitle": "九、购物与付款", "num": "145", "en": "heat... up", "zh": "把……加热", "audioChunk": "s8_3_chunk_heat_up.mp3", "chunkLocal": "audio_chunks/s8_3_chunk_heat_up.mp3", "core": "up 使动作带有“加热到可以吃／达到需要温度”的结果感。", "usage": "代词必须放中间：heat it up；名词可放中间或后面。", "warn": "不能自然说 heat up it；代词位置要记住。", "examples": [{"en": "Could you heat this bento up?", "zh": "可以加热这个便当吗？", "audio": "s8_3_s0_Could_you_heat_this_bento_up.mp3", "localAudio": "audio_chunks/s8_3_s0_Could_you_heat_this_bento_up.mp3"}, {"en": "Please heat it up for me.", "zh": "请帮我加热一下。", "audio": "s8_3_s1_Please_heat_it_up_for_me.mp3", "localAudio": "audio_chunks/s8_3_s1_Please_heat_it_up_for_me.mp3"}]}, {"id": 146, "secIdx": 9, "secTitle": "九、购物与付款", "num": "146", "en": "for + 时间段...", "zh": "持续了多久（测量时间跨度）", "audioChunk": "daily_split_146_for.mp3", "chunkLocal": "audio_chunks/daily_split_146_for.mp3", "core": "接一段时间长度，测量某个动作或状态持续的时间总量。", "usage": "for + two hours / three days / five years", "warn": "测量时长必须用 for，不能用 since。", "examples": [{"en": "I've been here for hours.", "zh": "我在这儿待好几个小时了。", "audio": "beauty_short_146_ex0.mp3", "localAudio": "audio_chunks/beauty_short_146_ex0.mp3"}, {"en": "We've made skincare for ten years.", "zh": "我们做护肤品已经有十年了。", "audio": "beauty_short_146_ex1.mp3", "localAudio": "audio_chunks/beauty_short_146_ex1.mp3"}]}, {"id": 147, "secIdx": 9, "secTitle": "九、购物与付款", "num": "147", "en": "since + 时间点...", "zh": "自从何时开始（标出起点时间）", "audioChunk": "daily_split_147_since.mp3", "chunkLocal": "audio_chunks/daily_split_147_since.mp3", "core": "接具体的某个时间点或过去某个事件，标出动作延续至今的出发点。", "usage": "since + 2020 / Monday / graduation", "warn": "常与现在完成时连用，后面接具体的起点时间。", "examples": [{"en": "Our company has been fully remote since 2021.", "zh": "我们公司自从2021年起就全面实行远程办公了。", "audio": "daily_split_147_ex0_Our_company_has_been_fully_rem.mp3", "localAudio": "audio_chunks/daily_split_147_ex0_Our_company_has_been_fully_rem.mp3"}, {"en": "We've supplied them since 2020.", "zh": "我们从2020年起就给他们供货了。", "audio": "beauty_short_147_ex1.mp3", "localAudio": "audio_chunks/beauty_short_147_ex1.mp3"}]}, {"id": 148, "secIdx": 9, "secTitle": "九、购物与付款", "num": "148", "en": "pay for...", "zh": "为……付款、用……付款", "audioChunk": "s8_5_chunk_pay_for.mp3", "chunkLocal": "audio_chunks/s8_5_chunk_pay_for.mp3", "core": "for 指钱对应的商品或服务；by 指付款方式。", "usage": "pay for the order；pay by card。", "warn": "不要混成 pay the item；普通商品前通常要有 for。", "examples": [{"en": "I’d like to pay for these.", "zh": "我想结账。", "audio": "s8_5_s0_I_d_like_to_pay_for_these.mp3", "localAudio": "audio_chunks/s8_5_s0_I_d_like_to_pay_for_these.mp3"}, {"en": "I usually pay by card.", "zh": "我通常刷卡。", "audio": "s8_5_s1_I_usually_pay_by_card.mp3", "localAudio": "audio_chunks/s8_5_s1_I_usually_pay_by_card.mp3"}]}, {"id": 149, "secIdx": 9, "secTitle": "九、购物与付款", "num": "149", "en": "split... into...", "zh": "把付款分成……", "audioChunk": "s8_6_chunk_split_into.mp3", "chunkLocal": "audio_chunks/s8_6_chunk_split_into.mp3", "core": "把一个整体支付拆成不同部分或方式。", "usage": "split the payment into cash and card；split the bill two ways。", "warn": "split into 强调拆成哪些部分；餐厅的 split the check 常直接表示分账。", "examples": [{"en": "Can I split the payment between cash and card?", "zh": "可以一部分现金一部分刷卡吗？", "audio": "s9_6_v2.mp3", "localAudio": "audio_chunks/s9_6_v2.mp3"}, {"en": "Can we split the bill two ways?", "zh": "可以把账单分成两份吗？", "audio": "s8_6_s1_Can_we_split_the_bill_two_ways.mp3", "localAudio": "audio_chunks/s8_6_s1_Can_we_split_the_bill_two_ways.mp3"}]}, {"id": 150, "secIdx": 9, "secTitle": "九、购物与付款", "num": "150", "en": "the total comes to...", "zh": "总计是……", "audioChunk": "s8_7_chunk_the_total_comes_to.mp3", "chunkLocal": "audio_chunks/s8_7_chunk_the_total_comes_to.mp3", "core": "come to 在结账语境表示计算后的结果达到某个金额。", "usage": "主语常是 total、bill；后接金额。", "warn": "不要理解成“总数走到十五美元”。它是金额结果表达。", "examples": [{"en": "The total comes to fifteen dollars.", "zh": "总计十五美元。", "audio": "s8_7_s0_The_total_comes_to_fifteen_dollars.mp3", "localAudio": "audio_chunks/s8_7_s0_The_total_comes_to_fifteen_dollars.mp3"}, {"en": "Your bill comes to forty dollars.", "zh": "您的账单共四十美元。", "audio": "s8_7_s1_Your_bill_comes_to_forty_dollars.mp3", "localAudio": "audio_chunks/s8_7_s1_Your_bill_comes_to_forty_dollars.mp3"}]}, {"id": 151, "secIdx": 9, "secTitle": "九、购物与付款", "num": "151", "en": "pay extra for...", "zh": "为……额外付费", "audioChunk": "s8_8_chunk_pay_extra_for.mp3", "chunkLocal": "audio_chunks/s8_8_chunk_pay_extra_for.mp3", "core": "基础价格之外，还要因为某项物品或服务增加费用。", "usage": "pay extra for 后接 bag、 _get_one_free_deal.mp3"}]}, {"id": 157, "secIdx": 9, "secTitle": "九、购物与付款", "num": "157", "en": "the discount applies if...", "zh": "如果……可以享受折扣", "audioChunk": "s8_13_chunk_the_discount_applies_if.mp3", "chunkLocal": "audio_chunks/s8_13_chunk_the_discount_applies_if.mp3", "core": "apply 在这里表示规则适用于当前情况。", "usage": "the discount applies 后接条件；也可说 apply to + 商品/人。", "warn": "这里不是“申请折扣”的 apply，而是“规则适用”。", "examples": [{"en": "Does the discount apply if I buy two?", "zh": "买两个可以享受折扣吗？", "audio": "s8_13_s0_Does_the_discount_apply_if_I_buy_two.mp3", "localAudio": "audio_chunks/s8_13_s0_Does_the_discount_apply_if_I_buy_two.mp3"}, {"en": "This discount applies to all items.", "zh": "这个折扣适用于全部商品。", "audio": "s8_13_s1_This_discount_applies_to_all_items.mp3", "localAudio": "audio_chunks/s8_13_s1_This_discount_applies_to_all_items.mp3"}]}, {"id": 158, "secIdx": 9, "secTitle": "九、购物与付款", "num": "158", "en": "return...", "zh": "退货、退回", "audioChunk": "daily_146_return.mp3", "chunkLocal": "audio_chunks/daily_146_return.mp3", "core": "将不满意的商品退回商家并拿回退款。", "usage": "return the item within 30 days", "warn": "退货需要小票可以说 Please keep the receipt for returns。", "examples": [{"en": "I'd like to return this shirt.", "zh": "我想把这件衬衫退了。", "audio": "beauty_short_158_ex0.mp3", "localAudio": "audio_chunks/beauty_short_158_ex0.mp3"}, {"en": "Can we return the leaking bottles?", "zh": "我们可以退回漏液的瓶子吗？", "audio": "beauty_short_158_ex1.mp3", "localAudio": "audio_chunks/beauty_short_158_ex1.mp3"}]}, {"id": 159, "secIdx": 9, "secTitle": "九、购物与付款", "num": "159", "en": "exchange A for B", "zh": "把A调换成B", "audioChunk": "daily_147_exchange_A_for_B.mp3", "chunkLocal": "audio_chunks/daily_147_exchange_A_for_B.mp3", "core": "将尺寸、颜色不合或有瑕疵的商品更换为另一件。", "usage": "exchange this for a larger size", "warn": "换货用 exchange，不用 change。", "examples": [{"en": "Can I exchange this for medium?", "zh": "能帮我把这个换成中号吗？", "audio": "beauty_short_159_ex0.mp3", "localAudio": "audio_chunks/beauty_short_159_ex0.mp3"}, {"en": "Exchange this shade for shade two.", "zh": "把这个色号换成2号色。", "audio": "beauty_short_159_ex1.mp3", "localAudio": "audio_chunks/beauty_short_159_ex1.mp3"}]}, {"id": 160, "secIdx": 9, "secTitle": "九、购物与付款", "num": "160", "en": "be charged...", "zh": "被收取……费用", "audioChunk": "s8_15_chunk_be_charged.mp3", "chunkLocal": "audio_chunks/s8_15_chunk_be_charged.mp3", "core": "从顾客角度描述系统或商家把费用计到自己账上。", "usage": "be charged twice/ten dollars/for a bag。", "warn": "charge 在这里不是充电；被动形式关注顾客承担的费用。", "examples": [{"en": "I was charged twice.", "zh": "我被重复扣款了。", "audio": "s8_15_s0_I_was_charged_twice.mp3", "localAudio": "audio_chunks/s8_15_s0_I_was_charged_twice.mp3"}, {"en": "Were you charged for the bag?", "zh": "袋子收费了吗？", "audio": "s8_15_s1_Were_you_charged_for_the_bag.mp3", "localAudio": "audio_chunks/s8_15_s1_Were_you_charged_for_the_bag.mp3"}]}, {"id": 161, "secIdx": 9, "secTitle": "九、购物与付款", "num": "161", "en": "a minimum charge for...", "zh": "……的最低消费、最低收费", "audioChunk": "s8_16_chunk_a_minimum_charge_for.mp3", "chunkLocal": "audio_chunks/s8_16_chunk_a_minimum_charge_for.mp3", "core": "说明使用某种服务需要达到最低金额。", "usage": "a minimum charge for paying by card/delivery。", "warn": "有的场景实际说 minimum purchase 更准确；页面会说明商家规则差异。", "examples": [{"en": "Is there a minimum charge for paying by card?", "zh": "刷卡有最低消费吗？", "audio": "s8_16_s0_Is_there_a_minimum_charge_for_paying_by_card.mp3", "localAudio": "audio_chunks/s8_16_s0_Is_there_a_minimum_charge_for_paying_by_card.mp3"}, {"en": "There’s a minimum charge for delivery.", "zh": "配送有最低收费。", "audio": "s8_16_s1_There_s_a_minimum_charge_for_delivery.mp3", "localAudio": "audio_chunks/s8_16_s1_There_s_a_minimum_charge_for_delivery.mp3"}]}, {"id": 162, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "162", "en": "have a reservation for...", "zh": "有……人的预订", "audioChunk": "s9_1_chunk_have_a_reservation_for.mp3", "chunkLocal": "audio_chunks/s9_1_chunk_have_a_reservation_for.mp3", "core": "从顾客角度说明已经持有一个预订。", "usage": "have a reservation for two/four；可加时间。", "warn": "for 1_What_do_you_recommend_for_sensitive_skin.mp3", "localAudio": "audio_chunks/s9_10_s1_What_do_you_recommend_for_sensitive_skin.mp3"}]}, {"id": 174, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "174", "en": "enough to share", "zh": "分量足够大家分着吃", "audioChunk": "daily_161_enough_to_share.mp3", "chunkLocal": "audio_chunks/daily_161_enough_to_share.mp3", "core": "餐厅聚餐或下午茶点单时形容菜肴分量充裕。", "usage": "portion is large enough to share", "warn": "分量大可以分享用 big enough to share。", "examples": [{"en": "This pizza is big enough to share.", "zh": "这个披萨很大，够分着吃。", "audio": "beauty_short_174_ex0.mp3", "localAudio": "audio_chunks/beauty_short_174_ex0.mp3"}, {"en": "It's more than enough to share.", "zh": "这足够大家一起分享了。", "audio": "beauty_short_174_ex1.mp3", "localAudio": "audio_chunks/beauty_short_174_ex1.mp3"}]}, {"id": 175, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "175", "en": "meant for...", "zh": "专为……人设计、适合……群体", "audioChunk": "daily_162_meant_for.mp3", "chunkLocal": "audio_chunks/daily_162_meant_for.mp3", "core": "说明套餐人数规格或产品针对的目标受众。", "usage": "be meant for groups of 4", "warn": "适合某人或专为某人定制用 meant for。", "examples": [{"en": "This cleanser is meant for sensitive skin.", "zh": "这款洁面乳专为敏感肌设计。", "audio": "beauty_short_175_ex0.mp3", "localAudio": "audio_chunks/beauty_short_175_ex0.mp3"}, {"en": "This combo is meant for two.", "zh": "这个套餐适合两个人吃。", "audio": "beauty_short_175_ex1.mp3", "localAudio": "audio_chunks/beauty_short_175_ex1.mp3"}]}, {"id": 176, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "176", "en": "come with...", "zh": "配有……", "audioChunk": "s9_12_chunk_come_with.mp3", "chunkLocal": "audio_chunks/s9_12_chunk_come_with.mp3", "core": "说明点这个主项时默认随附什么。", "usage": "主菜或套餐作主语，后接配菜、饮料、服务。", "warn": "默认包含用 come with；额外另点要用 add/order。", "examples": [{"en": "Does this come with fries?", "zh": "这个配薯条吗？", "audio": "s9_12_s0_Does_this_come_with_fries.mp3", "localAudio": "audio_chunks/s9_12_s0_Does_this_come_with_fries.mp3"}, {"en": "The meal comes with a drink.", "zh": "套餐含一杯饮料。", "audio": "s9_12_s1_The_meal_comes_with_a_drink.mp3", "localAudio": "audio_chunks/s9_12_s1_The_meal_comes_with_a_drink.mp3"}]}, {"id": 177, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "177", "en": "instead of...", "zh": "而不是……、用……代替", "audioChunk": "daily_split_177_instead_of.mp3", "chunkLocal": "audio_chunks/daily_split_177_instead_of.mp3", "core": "明确排除某个选项，改用另一个选项替代。", "usage": "instead of + 名词 / 动名词-ing", "warn": "餐饮更换配菜或职场更改方案必备。", "examples": [{"en": "Can I get salad instead of fries?", "zh": "能把薯条换成沙拉吗？", "audio": "s9_13_s0_Can_I_get_salad_instead_of_fries.mp3", "localAudio": "audio_chunks/s9_13_s0_Can_I_get_salad_instead_of_fries.mp3"}, {"en": "Use pump bottles instead of jars.", "zh": "改用压泵瓶，不要用广口罐。", "audio": "beauty_177_ex1_pump_bottles.mp3", "localAudio": "audio_chunks/beauty_177_ex1_pump_bottles.mp3"}]}, {"id": 178, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "178", "en": "on the side", "zh": "另外放一边（酱汁、调料单独盛放）", "audioChunk": "daily_split_178_on_the_side.mp3", "chunkLocal": "audio_chunks/daily_split_178_on_the_side.mp3", "core": "就餐点菜时要求把酱汁、沙拉酱或配料单独盛在小碟子里，不直接浇在主菜上。", "usage": "dressing / sauce on the side", "warn": "海外餐厅点沙拉或牛排时的黄金高频句。", "examples": [{"en": "Could I get the dressing on the side?", "zh": "沙拉酱可以单独放在旁边吗？", "audio": "s9_13_s1_Could_I_get_the_dressing_on_the_side.mp3", "localAudio": "audio_chunks/s9_13_s1_Could_I_get_the_dressing_on_the_side.mp3"}, {"en": "Can I get sauce on the side?", "zh": "能把酱汁单独盛在旁边吗？", "audio": "daily_178_ex1_sauce_on_side.mp3", "localAudio": "audio_chunks/daily_178_ex1_sauce_on_side.mp3"}]}, {"id": 179, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "179", "en": "make it...", "zh": "把它做成……", "audioChunk": "s9_14_chunk_make_it.mp3", "chunkLocal": "audio_chunks/s9_14_chunk_make_it.mp3", "core": "用 it 代替正在点的食物，再说明希望达到的结果。", "usage": "make it mild/spicy/medium-rare。", "warn": "必须结合点餐上下文理解 it 指哪道食物。", "examples": [{"en": "Could you make it mild?", "zh": "可以做得不辣吗？", "audio": "s9_14_s0_Could_you_make_it_mild.mp3", "localAudio": "audio_chunks/s9_14_s0_Could_you_make_it_mild.mp3"}, {"en": "Please make it medium-rare.", "zh": "请做成三分熟。", "audio": "s9_14_s1_Please_make_it_medium_rare.mp3", "localAudio": "audio_chunks/s9_14_s1_Please_make_it_medium_rare.mp3"}]}, {"id": 180, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "180", "en": "hold the 食材", "zh": "不要放……", "audioChunk": "s9_15_chunk_hold_the.mp3", "chunkLocal": "audio_chunks/s9_15_chunk_hold_the.mp3", "core": "hold 是餐厅常用指令，表示制作时省去某种食材。", "usage": "hold the onions；without ice。", "warn": "这里的 hold 不是“拿着”，而是“不要加入”。", "examples": [{"en": "Could you hold the onions?", "zh": "可以不放洋葱吗？", "audio": "s9_15_s0_Could_you_hold_the_onions.mp3", "localAudio": "audio_chunks/s9_15_s0_Could_you_hold_the_onions.mp3"}, {"en": "I’d like it without ice.", "zh": "我想要不加冰。", "audio": "s9_15_s1_I_d_like_it_without_ice.mp3", "localAudio": "audio_chunks/s9_15_s1_I_d_like_it_without_ice.mp3"}]}, {"id": 181, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "181", "en": "be allergic to 成分", "zh": "对……过敏", "audioChunk": "s9_16_chunk_be_allergic_to.mp3", "chunkLocal": "audio_chunks/s9_16_chunk_be_allergic_to.mp3", "core": "描述身体对某种成分有过敏反应。", "usage": "人作主语，后接 nuts、shellfish、peanuts。", "warn": "严重过敏不要只说不喜欢，应明确使用 allergic。", "examples": [{"en": "I’m allergic to shellfish.", "zh": "我对贝类过敏。", "audio": "s9_16_s0_I_m_allergic_to_shellfish.mp3", "localAudio": "audio_chunks/s9_16_s0_I_m_allergic_to_shellfish.mp3"}, {"en": "My child is allergic to peanuts.", "zh": "我的孩子对花生过敏。", "audio": "s9_16_s1_My_child_is_allergic_to_peanuts.mp3", "localAudio": "audio_chunks/s9_16_s1_My_child_is_allergic_to_peanuts.mp3"}]}, {"id": 182, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "182", "en": "avoid anything containing 成分", "zh": "避免任何含有……的东西", "audioChunk": "s9_17_chunk_avoid_anything_containing.mp3", "chunkLocal": "audio_chunks/s9_17_chunk_avoid_anything_containing.mp3", "core": "让对方不仅排除明显原料，也排除所有含该成分的食物。", "usage": "anything containing 后接过敏原或需避开的成分。", "warn": "containing 修饰 anything/products；不是一个新的主要动作。", "examples": [{"en": "I need to avoid anything containing shellfish.", "zh": "我必须避开所有含贝类的食物。", "audio": "s9_17_s0_I_need_to_avoid_anything_containing_shellfish.mp3", "localAudio": "audio_chunks/s9_17_s0_I_need_to_avoid_anything_containing_shellfish.mp3"}, {"en": "Avoid products containing alcohol.", "zh": "避免含酒精的产品。", "audio": "s9_17_s1_Avoid_products_containing_alcohol.mp3", "localAudio": "audio_chunks/s9_17_s1_Avoid_products_containing_alcohol.mp3"}]}, {"id": 183, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "183", "en": "check with...", "zh": "向……核实", "audioChunk": "s9_18_chunk_check_with.mp3", "chunkLocal": "audio_chunks/s9_18_chunk_check_with.mp3", "core": "自己暂时没有答案，需要向有信息或权限的人确认。", "usage": "后接 the kitchen、manager、product team。", "warn": "不是“和某人一起检查”，而是向该来源询问信息。", "examples": [{"en": "Thank you for checking with the kitchen.", "zh": "谢谢你向厨房确认。", "audio": "s9_18_s0_Thank_you_for_checking_with_the_kitchen.mp3", "localAudio": "audio_chunks/s9_18_s0_Thank_you_for_checking_with_the_kitchen.mp3"}, {"en": "I’ll check with our product team.", "zh": "我会向产品团队确认。", "audio": "s9_18_s1_I_ll_check_with_our_product_team.mp3", "localAudio": "audio_chunks/s9_18_s1_I_ll_check_with_our_product_team.mp3"}]}, {"id": 184, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "184", "en": "go with...", "zh": "选择、决定选……", "audioChunk": "daily_split_184_go_with.mp3", "chunkLocal": "audio_chunks/daily_split_184_go_with.mp3", "core": "在面临两个或多个备选方案时，最终拍板选定某一个。", "usage": "go with + 选项 / 方案", "warn": "做商业选型或挑菜单时极常用。", "examples": [{"en": "I'll go with this one.", "zh": "我决定选这个了。", "audio": "beauty_short_184_ex0.mp3", "localAudio": "audio_chunks/beauty_short_184_ex0.mp3"}, {"en": "We'll go with glass dropper bottles.", "zh": "我们决定选用玻璃滴管瓶。", "audio": "beauty_short_184_ex1.mp3", "localAudio": "audio_chunks/beauty_short_184_ex1.mp3"}]}, {"id": 185, "secIdx": 10, "secTitle": "十、餐厅、点餐与用餐服务", "num": "185", "en": "I'll have...", "zh": "我要一份……（最自然的点餐/要东西口语）", " bottles.mp3"}]}, {"id": 230, "secIdx": 11, "secTitle": "十一、工作、订单与外贸沟通", "num": "230", "en": "arrive in good condition", "zh": "货物完好无损送达", "audioChunk": "s10_28_chunk_arrive_in_good_condition.mp3", "chunkLocal": "audio_chunks/s10_28_chunk_arrive_in_good_condition.mp3", "core": "确认货物通过验收无损伤，向发货方报平安与致谢。", "usage": "all items arrived in perfect condition", "warn": "完好收货标准正面反馈句式。", "examples": [{"en": "The boxes arrived in good condition.", "zh": "外箱包装完好无损地送达了。", "audio": "s10_28_s1_The_boxes_arrived_in_good_condition.mp3", "localAudio": "audio_chunks/s10_28_s1_The_boxes_arrived_in_good_condition.mp3"}, {"en": "The package arrived in perfect condition.", "zh": "包裹完好无损地送达了。", "audio": "beauty_230_ex1_perfect_condition.mp3", "localAudio": "audio_chunks/beauty_230_ex1_perfect_condition.mp3"}]}, {"id": 231, "secIdx": 11, "secTitle": "十一、工作、订单与外贸沟通", "num": "231", "en": "provide...", "zh": "提供……", "audioChunk": "s10_29_chunk_provide.mp3", "chunkLocal": "audio_chunks/s10_29_chunk_provide.mp3", "core": "售后核查中请求对方提交可验证问题的信息。", "usage": "后接 order number、batch number、photos、number of affected units。", "warn": "provide 后可直接接物品；表示给某人时用 provide someone with something。", "examples": [{"en": "Please provide the order number and batch number.", "zh": "请提供订单号和批次号。", "audio": "s10_29_s0_Please_provide_the_order_number_and_batch_number.mp3", "localAudio": "audio_chunks/s10_29_s0_Please_provide_the_order_number_and_batch_number.mp3"}, {"en": "Could you provide clear photos?", "zh": "能否提供清晰照片？", "audio": "s10_29_s1_Could_you_provide_clear_photos.mp3", "localAudio": "audio_chunks/s10_29_s1_Could_you_provide_clear_photos.mp3"}]}, {"id": 232, "secIdx": 11, "secTitle": "十一、工作、订单与外贸沟通", "num": "232", "en": "check the issue with...", "zh": "和某部门核查问题", "audioChunk": "s10_30_chunk_check_the_issue_with.mp3", "chunkLocal": "audio_chunks/s10_30_chunk_check_the_issue_with.mp3", "core": "把问题交给拥有记录或专业能力的团队调查。", "usage": "后接 warehouse、quality team、carrier。", "warn": "这表示调查正在进行，不应同时假装已经确定责任。", "examples": [{"en": "We’re checking the issue with our warehouse.", "zh": "我们正与仓库核查问题。", "audio": "s10_30_s0_We_re_checking_the_issue_with_our_warehouse.mp3", "localAudio": "audio_chunks/s10_30_s0_We_re_checking_the_issue_with_our_warehouse.mp3"}, {"en": "We’ll check this with the carrier.", "zh": "我们会向承运商核查。", "audio": "s10_30_s1_We_ll_check_this_with_the_carrier.mp3", "localAudio": "audio_chunks/s10_30_s1_We_ll_check_this_with_the_carrier.mp3"}]}, {"id": 233, "secIdx": 11, "secTitle": "十一、工作、订单与外贸沟通", "num": "233", "en": "once the issue is verified", "zh": "问题核实后、合适方案", "audioChunk": "s10_31_chunk_once_the_issue_is_verified.mp3", "chunkLocal": "audio_chunks/s10_31_chunk_once_the_issue_is_verified.mp3", "core": "先验证事实和范围，再决定与情况匹配的处理方式。", "usage": "once + 小句；solution 前可用 discuss、offer、find。", "warn": "appropriate 表示与实际情况相称，不预先承诺固定赔付。", "examples": [{"en": "Once the issue is verified, we’ll discuss an appropriate solution.", "zh": "问题核实后，我们会讨论合适方案。", "audio": "s10_31_s0_Once_the_issue_is_verified_we_ll_discuss_an_appropriate_solution.mp3", "localAudio": "audio_chunks/s10_31_s0_Once_the_issue_is_verified_we_ll_discuss_an_appropriate_solution.mp3"}, {"en": "We’ll offer a solution based on the findings.", "zh": "我们会根据调查结果提供方案。", "audio": "s10_31_s1_We_ll_offer_a_solution_based_on_the_findings.mp3", "localAudio": "audio_chunks/s10_31_s1_We_ll_offer_a_solution_based_on_the_findings.mp3"}]}, {"id": 234, "secIdx": 11, "secTitle": "十一、工作、订单与外贸沟通", "num": "234", "en": "include 补发品 in 下一批货", "zh": "把补发品放入下一批货", "audioChunk": "s10_32_chunk_include_in.mp3", "chunkLocal": "audio_chunks/s10_32_chunk_include_in.mp3", "core": "说明补发不是单独寄出，而是随下一次出货一起发送。", "usage": "include the replacement units in your next shipment。", "warn": "include 只表示纳入，不自动说明是否免费或何时发出，必要时要补充。", "examples": [{"en": "We can include the replacement units in your next shipment.", "zh": "我们可以把补发产品放进下一批货。", "audio": "s10_32_s0_We_can_include_the_replacement_units_in_your_next_shipment.mp3", "localAudio": "audio_chunks/s10_32_s0_We_can_include_the_replacement_units_in_your_next_shipment.mp3"}, {"en": "Please include the samples in this shipment.", "zh": "请把样品放进这批货。", "audio": "s10_32_s1_Please_include_the_samples_in_this_shipment.mp3", "localAudio": "audio_chunks/s10_32_s1_Please_include_the_samples_in_this_shipment.mp3"}]}, {"id": 235, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "235", "en": "because...", "zh": "因为……（引导完整句子从句）", "audioChunk": "daily_split_235_because.mp3", "chunkLocal": "audio_chunks/daily_split_235_because.mp3", "core": "后面必须接完整的“主语 + 谓语”句子，解释事情发生的原因。", "usage": "because + 完整句子", "warn": "口语常用 'cause 弱读。", "examples": [{"en": "We waited because the table wasn’t ready.", "zh": "我们稍微等了等，因为餐桌还没收拾好。", "audio": "s11_1_s0_We_waited_because_the_table_wasn_t_ready.mp3", "localAudio": "audio_chunks/s11_1_s0_We_waited_because_the_table_wasn_t_ready.mp3"}, {"en": "I called because I need help.", "zh": "我打电话是因为需要帮忙。", "audio": "daily_235_ex1_need_help.mp3", "localAudio": "audio_chunks/daily_235_ex1_need_help.mp3"}]}, {"id": 236, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "236", "en": "because of...", "zh": "由于、因为某事（接名词或短语）", "audioChunk": "daily_split_236_because_of.mp3", "chunkLocal": "audio_chunks/daily_split_236_because_of.mp3", "core": "后面只能接名词、代词或动名词短语，不能接完整句子。", "usage": "because of + 名词短语", "warn": "简明利落地归结原因用 because of。", "examples": [{"en": "The shipment was delayed because of the weather.", "zh": "由于恶劣天气原因，这批货物的运送有所延误。", "audio": "s11_1_s1_The_shipment_was_delayed_because_of_the_weather.mp3", "localAudio": "audio_chunks/s11_1_s1_The_shipment_was_delayed_because_of_the_weather.mp3"}, {"en": "We were late because of traffic.", "zh": "因为堵车我们迟到了。", "audio": "daily_236_ex1_traffic.mp3", "localAudio": "audio_chunks/daily_236_ex1_traffic.mp3"}]}, {"id": 237, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "237", "en": "due to...", "zh": "由于……", "audioChunk": "s11_2_chunk_due_to.mp3", "chunkLocal": "audio_chunks/s11_2_chunk_due_to.mp3", "core": "和 because of 接近，但语气更正式，常用于工作说明。", "usage": "后接名词性原因。", "warn": "日常聊天可以用 because of；正式说明常见 due to。", "examples": [{"en": "The delay was due to customs clearance.", "zh": "延误是由于清关。", "audio": "s11_2_s0_The_delay_was_due_to_customs_clearance.mp3", "localAudio": "audio_chunks/s11_2_s0_The_delay_was_due_to_customs_clearance.mp3"}, {"en": "We closed early due to the weather.", "zh": "因天气原因我们提前关门。", "audio": "s11_2_s1_We_closed_early_due_to_the_weather.mp3", "localAudio": "audio_chunks/s11_2_s1_We_closed_early_due_to_the_weather.mp3"}]}, {"id": 238, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "238", "en": "if 条件, 结果", "zh": "如果……就……", "audioChunk": "s11_3_chunk_if.mp3", "chunkLocal": "audio_chunks/s11_3_chunk_if.mp3", "core": "先设定一个可能条件，再说明条件成立时会怎样。", "usage": "if 后接完整小句；谈将来时条件部分通常不用 will。", "warn": "通常说 If it is... I will...，不说 If it will be...。", "examples": [{"en": "If you buy two, the discount applies.", "zh": "如果买两个，可以享受折扣。", "audio": "s11_3_s0_If_you_buy_two_the_discount_applies.mp3", "localAudio": "audio_chunks/s11_3_s0_If_you_buy_two_the_discount_applies.mp3"}, {"en": "If it’s available, I’ll take it.", "zh": "如果有货，我就要。", "audio": "s11_3_s1_If_it_s_available_I_ll_take_it.mp3", "localAudio": "audio_chunks/s11_3_s1_If_it_s_available_I_ll_take_it.mp3"}]}, {"id": 239, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "239", "en": "as long as 条件", "zh": "只要……", "audioChunk": "s11_4_chunk_as_long_as.mp3", "chunkLocal": "audio_chunks/s11_4_chunk_as_long_as.mp3", "core": "表示只需要满足这个关键条件，其他细节可以接受。", "usage": "后接完整小句。", "warn": "它也可表示时间“和……一样久”，要根据上下文判断。", "examples": [{"en": "Any color is fine as long as it’s in stock.", "zh": "只要有货，任何颜色都行。", "audio": "s11_4_s0_Any_color_is_fine_as_long_as_it_s_in_stock.mp3", "localAudio": "audio_chunks/s11_4_s0_Any_color_is_fine_as_long_as_it_s_in_stock.mp3"}, {"en": "We can proceed as long as the details are confirmed.", "zh": "只要细节确认，我们就能继续。", "audio": "s11_4_s1_We_can_proceed_as_long_as_the_details_are_confirmed.mp3", "localAudio": "audio_chunks/s11_4_s1_We_can_proceed_as_long_as_the_details_are_confirmed.mp3"}]}, {"id": 240, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "240", "en": "in case 情况", "zh": "以防……", "audioChunk": "s11_5_chunk_in_case.mp3", "chunkLocal": "audio_chunks/s11_5_chunk_in_case.mp3", "core": "提前做准备，应对一个不确定但可能发生的情况。", "usage": "后接完整小句；也常见 in case of + 名词。", "warn": "不是普通的“如果”。它强调预防性准备。", "examples": [{"en": "Take an umbrella in case it rains.", "zh": "带伞以防下雨。", "audio": "s11_5_s0_Take_an_umbrella_in_case_it_rains.mp3", "localAudio": "audio_chunks/s11_5_s0_Take_an_umbrella_in_case_it_rains.mp3"}, {"en": "Keep the receipt in case you need to return it.", "zh": "留好小票，以防需要退货。", "audio": "s11_5_s1_Keep_the_receipt_in_case_you_need_to_return_it.mp3", "localAudio": "audio_chunks/s11_5_s1_Keep_the_receipt_in_case_you_need_to_return_it.mp3"}]}, {"id": 241, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "241", "en": "according to...", "zh": "根据……所说、所示", "audioChunk": "s11_6_chunk_according_to.mp3", "chunkLocal": "audio_chunks/s11_6_chunk_according_to.mp3", "core": "说明信息来自某个文件、人、记录或规则。", "usage": "后接 the quotation、tracking information、policy。", "warn": "不要用它表达自己的个人看法，如 according to me 不自然。", "examples": [{"en": "According to the tracking information, it will arrive Friday.", "zh": "根据物流信息，周五到。", "audio": "s11_6_s0_According_to_the_tracking_information_it_will_arrive_Friday.mp3", "localAudio": "audio_chunks/s11_6_s0_According_to_the_tracking_information_it_will_arrive_Friday.mp3"}, {"en": "According to the quotation, shipping is included.", "zh": "根据报价，运费已包含。", "audio": "s11_6_s1_According_to_the_quotation_shipping_is_included.mp3", "localAudio": "audio_chunks/s11_6_s1_According_to_the_quotation_shipping_is_included.mp3"}]}, {"id": 242, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "242", "en": "not only A but also B", "zh": "不但A，而且B", "audioChunk": "s11_7_chunk_not_only_A_but_also_B.mp3", "chunkLocal": "audio_chunks/s11_7_chunk_not_only_A_but_also_B.mp3", "core": "强调第二项是在第一项基础上的额外信息。", "usage": "A和B保持相同语法形式。", "warn": "结构两侧要平行：名词对名词、形容词对形容词。", "examples": [{"en": "The product is not only gentle but also effective.", "zh": "产品不仅温和，而且有效。", "audio": "s11_7_s0_The_product_is_not_only_gentle_but_also_effective.mp3", "localAudio": "audio_chunks/s11_7_s0_The_product_is_not_only_gentle_but_also_effective.mp3"}, {"en": "It saves not only time but also money.", "zh": "它不仅省时间，也省钱。", "audio": "s11_7_s1_It_saves_not_only_time_but_also_money.mp3", "localAudio": "audio_chunks/s11_7_s1_It_saves_not_only_time_but_also_money.mp3"}]}, {"id": 243, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "243", "en": "both A and B", "zh": "A和B两者都……（两者兼备）", "audioChunk": "daily_split_243_both.mp3", "chunkLocal": "audio_chunks/daily_split_243_both.mp3", "core": "将两个对象同时涵盖进来，强调两方面都要或都符合条件。", "usage": "both + A + and + B", "warn": "作主语时谓语动词用复数。", "examples": [{"en": "We need both photos and videos.", "zh": "我们需要高清照片和实拍视频。", "audio": "s11_8_s0_We_need_both_photos_and_videos.mp3", "localAudio": "audio_chunks/s11_8_s0_We_need_both_photos_and_videos.mp3"}, {"en": "We need both time and money.", "zh": "我们既需要时间也需要资金。", "audio": "daily_243_ex1_time_money.mp3", "localAudio": "audio_chunks/daily_243_ex1_time_money.mp3"}]}, {"id": 244, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "244", "en": "either A or B", "zh": "要么A要么B、二选一（两者任选其一）", "audioChunk": "daily_split_244_either.mp3", "chunkLocal": "audio_chunks/daily_split_244_either.mp3", "core": "在两个选项之间做出选择，二者居其一即可满足条件。", "usage": "either + A + or + B", "warn": "就近一致原则；表示二选一都可以。", "examples": [{"en": "You can choose either air or sea shipping.", "zh": "您可以自由选择空运或海运方式。", "audio": "s11_8_s1_You_can_choose_either_air_or_sea_shipping.mp3", "localAudio": "audio_chunks/s11_8_s1_You_can_choose_either_air_or_sea_shipping.mp3"}, {"en": "You can pay cash or card.", "zh": "你可以付现金也可以刷卡。", "audio": "daily_244_ex1_cash_card.mp3", "localAudio": "audio_chunks/daily_244_ex1_cash_card.mp3"}]}, {"id": 245, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "245", "en": "before...,...", "zh": "在……前、后", "audioChunk": "s11_9_chunk_before.mp3", "chunkLocal": "audio_chunks/s11_9_chunk_before.mp3", "core": "用一个事件给另一个动作定位。", "usage": "可接名词、-ing 或完整小句。", "warn": "接动作而没有主语时要用 -ing。", "examples": [{"en": "Confirm the quantity before we process the order.", "zh": "处理订单前确认数量。", "audio": "s11_9_s0_Confirm_the_quantity_before_we_process_the_order.mp3", "localAudio": "audio_chunks/s11_9_s0_Confirm_the_quantity_before_we_process_the_order.mp3"}, {"en": "Check the product after opening it.", "zh": "开封后检查产品。", "audio": "s11_9_s1_Check_the_product_after_opening_it.mp3", "localAudio": "audio_chunks/s11_9_s1_Check_the_product_after_opening_it.mp3"}]}, {"id": 246, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "246", "en": "so 结果", "zh": "所以、因此……", "audioChunk": "s11_10_chunk_so.mp3", "chunkLocal": "audio_chunks/s11_10_chunk_so.mp3", "core": "前面给原因或情况，so 引出自然结果。", "usage": "连接两个完整意思；口语非常常见。", "warn": "正式写作可选 therefore，但日常表达用 so 更自然。", "examples": [{"en": "I brought my own bag, so no bag is needed.", "zh": "我自带了袋子，所以不需要袋子。", "audio": "s11_10_s0_I_brought_my_own_bag_so_no_bag_is_needed.mp3", "localAudio": "audio_chunks/s11_10_s0_I_brought_my_own_bag_so_no_bag_is_needed.mp3"}, {"en": "It’s late, so I should leave.", "zh": "很晚了，所以我该走了。", "audio": "s11_10_s1_It_s_late_so_I_should_leave.mp3", "localAudio": "audio_chunks/s11_10_s1_It_s_late_so_I_should_leave.mp3"}]}, {"id": 247, "secIdx": 12, "secTitle": "十二、原因、条件与句子连接", "num": "247", "en": "but 转折内容", "zh": "但是……", "audioChunk": "s11_11_chunk_but.mp3", "chunkLocal": "audio_chunks/s11_11_chunk_but.mp3", "core": "承认前面信息，同时加入与预期不同或相反的内容。", "usage": "连接两个同类词语或两个完整小句。", "warn": "不要因为中文有“但是”就重复使用 although...but...；英语通常二选一。", "examples": [{"en": "I’m not sure, but I think so.", "zh": "我不确定，但我觉得是。", "audio": "s11_11_s0_I_m_not_sure_but_I_think_so.mp3", "localAudio": "audio_chunks/s11_11_s0_I_m_not_sure_but_I_think_so.mp3"}, {"en": "We’re waiting on one person, but we can order drinks.", "zh": "还在等一个人，但可以先点     // Theme Management (Light vs Dark)
    const THEME_STORAGE_KEY = 'chunklab_theme';
    let currentTheme = 'light';

    function initTheme() {
      try {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'light';
        currentTheme = savedTheme;
      } catch(e) {
        currentTheme = 'light';
      }
      applyTheme();
    }

    function toggleTheme() {
      currentTheme = (currentTheme === 'light') ? 'dark' : 'light';
      try {
        localStorage.setItem(THEME_STORAGE_KEY, currentTheme);
      } catch(e) {}
      applyTheme();
    }

    function applyTheme() {
      const isDark = (currentTheme === 'dark');
      document.body.classList.toggle('theme-dark', isDark);
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      const btn = document.getElementById('btnThemeToggle');
      if (icon && label) {
        if (isDark) {
          icon.textContent = '☀️';
          label.textContent = '日间模式';
          if (btn) btn.classList.add('active');
        } else {
          icon.textContent = '🌙';
          label.textContent = '夜间模式';
          if (btn) btn.classList.remove('active');
        }
      }
    }

    // Audio Engine
    class AudioEngine {
      constructor() {
        this.audio = new Audio();
        this.speechSynth = window.speechSynthesis;
        this.currentActiveEl = null;

        this.audio.onerror = () => {
          if (this.currentFallbackText) {
            this.speakText(this.currentFallbackText);
          }
        };

        this.audio.onended = () => {
          if (isLooping && loopItem) {
            this.playItem(loopItem);
          } else {
            this.clearPlayingUI();
          }
        };
      }

      playItem(item) {
        this.stop();
        loopItem = item;
        updateBottomPlayer(item);

        const text = item.en;
        this.currentFallbackText = text;

        if (item.localAudio) {
          let src = item.localAudio;
          if (window.location.protocol.startsWith('http')) {
            src += (src.includes('?') ? '&' : '?') + 't=' + Date.now();
          }
          this.audio.src = src;
          this.audio.playbackRate = currentSpeed;
          this.audio.play().catch(() => {
            this.speakText(text);
          });
        } else {
          this.speakText(text);
        }
      }

      speakText(text) {
        if (!this.speechSynth) return;
        this.speechSynth.cancel();

        const cleanText = text
          .replace(/\+\s*名词/g, '')
          .replace(/\+\s*动词[^\s]*/g, '')
          .replace(/\.(2,)/g, '')
          .replace(/[\/\(\)]/g, ' ')
          .replace(/\$/g, ' dollars ')
          .trim();

        const utterance = new SpeechSynthesisUtterance(cleanText);
        utterance.lang = 'en-US';
        utterance.rate = currentSpeed;
        this.speechSynth.speak(utterance);
      }

      stop() {
        this.audio.pause();
        this.audio.currentTime = 0;
        if (this.speechSynth) this.speechSynth.cancel();
      }

      clearPlayingUI() {
        document.querySelectorAll('.is-speaking').forEach(el => el.classList.remove('is-speaking'));
        const btn = document.getElementById('btnPlayPause');
        if (btn) btn.textContent = '▶ 播放';
      }
    }
