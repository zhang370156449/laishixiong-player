<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>经典英语教材文库 · 数字化重制中心</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --accent: #0ea5e9;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
      --shadow-lg: 0 12px 24px -4px rgb(0 0 0 / 0.08), 0 8px 16px -6px rgb(0 0 0 / 0.04);
      --shadow-hover: 0 20px 30px -8px rgb(79 70 229 / 0.15), 0 8px 12px -4px rgb(0 0 0 / 0.06);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    /* Top Navigation Bar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--surface-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #4f46e5, #0ea5e9);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }
    .brand-text h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .brand-text p {
      font-size: 12px;
      color: var(--text-muted);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .nav-btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
    }
    .nav-btn-secondary:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    /* Hero Section */
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 44px 24px 24px;
      text-align: center;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      border: 1px solid rgba(79, 70, 229, 0.2);
    }
    .hero h2 {
      font-size: 34px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.8px;
      margin-bottom: 12px;
    }
    .hero p {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 660px;
      margin: 0 auto 30px;
    }

    /* Filter & Search Bar */
    .controls-wrapper {
      max-width: 1200px;
      margin: 0 auto 36px;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 400px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      font-size: 14px;
      background: var(--surface);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: all 0.2s ease;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 16px;
      pointer-events: none;
    }
    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--surface-border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .pill:hover {
      background: #f1f5f9;
      color: var(--text-main);
    }
    .pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25);
    }

    /* Bookshelf Grid */
    .bookshelf {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 32px;
      flex: 1;
    }

    /* Book Card */
    .book-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(79, 70, 229, 0.3);
    }

    /* Book Header with Cover and Meta */
    .card-top {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
    }
    .cover-container {
      width: 110px;
      height: 156px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12), -1px 0 3px rgba(0,0,0,0.08);
      position: relative;
      background: #e2e8f0;
      transition: transform 0.3s ease;
    }
    .book-card:hover .cover-container {
      transform: scale(1.03) rotate(-1deg);
    }
    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cover-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e293b, #334155);
      color: #fff;
      padding: 10px;
      text-align: center;
    }
    .cover-placeholder span {
      font-size: 26px;
      margin-bottom: 4px;
    }
    .cover-placeholder h4 {
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }

    .book-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .book-series {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .book-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .book-author {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      width: fit-content;
    }
    .status-badge.ready {
      background: #dcfce7;
      color: #15803d;
    }
    .status-badge.upcoming {
      background: #f1f5f9;
      color: #64748b;
    }

    .book-desc {
      font-size: 13px;
      color: #475569;
      margin-bottom: 16px;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .book-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }
    .tag-item {
      font-size: 11px;
      padding: 3px 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      color: #64748b;
    }

    /* Meta stats */
    .book-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: var(--text-muted);
      padding: 10px 0;
      border-top: 1px dashed var(--surface-border);
      border-bottom: 1px dashed var(--surface-border);
      margin-bottom: 18px;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Action Buttons */
    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-read {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 20px;
      background: var(--primary);
      color: #ffffff;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn-read:hover {
      background: var(--primary-hover);
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.35);
      transform: translateY(-1px);
    }
    .btn-read.disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .action-sub-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-sub {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 12px;
      background: #f8fafc;
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-sub:hover {
      background: #f1f5f9;
      color: var(--text-main);
      border-color: #cbd5e1;
    }

    /* Quick jump select dropdown */
    .quick-jump-select {
      flex: 1;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: 1px solid var(--surface-border);
      background: #ffffff;
      color: #334155;
      outline: none;
      cursor: pointer;
    }
    .quick-jump-select:hover {
      border-color: #cbd5e1;
    }

    /* Add book placeholder card */
    .add-card {
      border: 2px dashed #cbd5e1;
      background: rgba(248, 250, 252, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      border-radius: var(--radius-lg);
      min-height: 380px;
      color: var(--text-muted);
    }
    .add-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 16px;
      color: #64748b;
    }
    .add-card h3 {
      font-size: 17px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .add-card p {
      font-size: 13px;
      max-width: 280px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--surface-border);
      background: #ffffff;
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: auto;
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .hero h2 { font-size: 26px; }
      .bookshelf { grid-template-columns: 1fr; }
      .controls-wrapper { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
      .card-top { gap: 14px; }
      .cover-container { width: 90px; height: 128px; }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="books.html" class="brand">
      <div class="brand-icon">📚</div>
      <div class="brand-text">
        <h1>经典英语教材文库</h1>
        <p>Digital English Textbook Library</p>
      </div>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="nav-btn nav-btn-secondary" title="前往句子循环跟读播放器">
        <span>🎧 EchoLoop 随身跟读</span>
      </a>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-badge">✨ 矢量重制 · 纯净排版 · 目录跳转</div>
    <h2>经典英语教材数字化阅读中心</h2>
    <p>全本精细文字与矢量图表重制，搭载高精度目录导航与跨端响应式 PDF 阅读器，专为沉浸式精读而设计。</p>
  </section>

  <!-- Controls: Search & Category Filter -->
  <section class="controls-wrapper">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索教材名称、课文、作者..." autocomplete="off">
    </div>
    <div class="category-pills" id="categoryPills">
      <div class="pill active" data-cat="all">全部教材</div>
      <div class="pill" data-cat="ready">已精修上线</div>
      <div class="pill" data-cat="laishi">赖世雄美语</div>
      <div class="pill" data-cat="phonetics">音标发音</div>
      <div class="pill" data-cat="upcoming">即将上线</div>
    </div>
  </section>

  <!-- Bookshelf Cards Container -->
  <main class="bookshelf" id="bookshelfGrid">
    <!-- Populated dynamically from books.js -->
  </main>

  <!-- Footer -->
  <footer>
    <p>© 2026 赖世雄美语数字化重制计划 · 打造最纯净舒适的英语学习工具</p>
  </footer>

  <!-- Include database -->
  <script src="books.js"></script>
  <script>
    const bookshelfGrid = document.getElementById('bookshelfGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryPills = document.querySelectorAll('.pill');

    let currentFilter = 'all';
    let searchQuery = '';

    function renderBooks() {
      const books = window.BOOKS_DATABASE || [];
      const filtered = books.filter(book => {
        // category filter
        if (currentFilter === 'ready' && book.status !== 'ready') return false;
        if (currentFilter === 'upcoming' && book.status !== 'upcoming') return false;
        if (currentFilter === 'laishi' && book.category !== 'laishi') return false;
        if (currentFilter === 'phonetics' && book.category !== 'phonetics') return false;

        // search query
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          const matchTitle = (book.title || '').toLowerCase().includes(q);
          const matchEn = (book.enTitle || '').toLowerCase().includes(q);
          const matchDesc = (book.description || '').toLowerCase().includes(q);
          const matchAuthor = (book.author || '').toLowerCase().includes(q);
          const matchTags = (book.tags || []).some(t => t.toLowerCase().includes(q));
          if (!matchTitle && !matchEn && !matchDesc && !matchAuthor && !matchTags) return false;
        }
        return true;
      });

      let html = '';

      filtered.forEach(book => {
        const isReady = book.status === 'ready';
        const coverHtml = book.cover 
          ? `<img src="${book.cover}" alt="${book.title}" class="cover-img" loading="lazy">`
          : `<div class="cover-placeholder"><span>📖</span><h4>${book.title}</h4></div>`;

        // Generate quick chapter jump options if toc exists
        let quickJumpHtml = '';
        if (isReady && book.toc && book.toc.length > 0) {
          const options = book.toc
            .filter(item => item.page && (item.title.includes('Lesson') || item.title.includes('附录') || item.title.includes('目录')))
            .map(item => `<option value="${item.page}">${item.title}</option>`)
            .join('');

          quickJumpHtml = `
            <select class="quick-jump-select" onchange="if(this.value) window.location.href='reader.html?book=${book.id}&page=' + this.value">
              <option value="">⚡ 直达指定章节/课次...</option>
              ${options}
            </select>
          `;
        }

        html += `
          <div class="book-card">
            <div class="card-top">
              <div class="cover-container">
                ${coverHtml}
              </div>
              <div class="book-info">
                <span class="book-series">${book.series || '英语教材'}</span>
                <h3 class="book-title">${book.title}</h3>
                <span class="book-author">${book.author} · ${book.publishYear}</span>
                <span class="status-badge ${book.status}">
                  ${isReady ? '● ' + book.badge : '⏳ ' + book.badge}
                </span>
              </div>
            </div>

            <p class="book-desc">${book.description}</p>

            <div class="book-tags">
              ${(book.tags || []).map(tag => `<span class="tag-item">#${tag}</span>`).join('')}
            </div>

            <div class="book-stats">
              <div class="stat-item">📄 <strong>${book.totalPages}</strong> 页</div>
              <div class="stat-item">💾 <strong>${book.fileSize}</strong></div>
              <div class="stat-item">📑 <strong>带目录跳转</strong></div>
            </div>

            <div class="card-actions">
              ${isReady ? `
                <a href="reader.html?book=${book.id}" class="btn-read">
                  <span>📖 立即在线阅读</span>
                  <span style="font-size:12px;opacity:0.85">（完整目录快速跳转）</span>
                </a>
                <div class="action-sub-row">
                  ${quickJumpHtml}
                  <a href="${book.pdfUrl}" download class="btn-sub" title="直接下载本教材原始 PDF 文件">
                    <span>⬇️ 离线下载</span>
                  </a>
                </div>
              ` : `
                <button class="btn-read disabled" disabled>
                  <span>⏳ 正在数字化排版制作中...</span>
                </button>
              `}
            </div>
          </div>
        `;
      });

      // Add a card for uploading/extending more books
      html += `
        <div class="add-card">
          <div class="add-icon">➕</div>
          <h3>支持扩展无限新教材</h3>
          <p>后续新教材只需放入 PDF 文件并在配置中登记，即可自动在此展示并享有一键目录跳转功能。</p>
          <span style="font-size: 11px; padding: 4px 10px; background: #e2e8f0; border-radius: 6px; color: #475569;">
            可随时导入初级、中级及任意 PDF
          </span>
        </div>
      `;

      bookshelfGrid.innerHTML = html;
    }

    // Event listeners
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderBooks();
    });

    categoryPills.forEach(pill => {
      pill.addEventListener('click', () => {
        categoryPills.forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.getAttribute('data-cat');
        renderBooks();
      });
    });

    // Initial render
    renderBooks();
  </script>
</body>
</html>
