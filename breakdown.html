<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影视口语深度精讲剧场 | Extr@ English & 美剧拉片</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2f;
      --card-border: #243048;
      --primary: #f59e0b;
      --primary-light: #fbbf24;
      --accent: #38bdf8;
      --accent-green: #10b981;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Top Header */
    header {
      background: rgba(21, 29, 47, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-btn:hover {
      color: #fff;
      border-color: var(--primary);
      background: rgba(245, 158, 11, 0.1);
    }
    .nav-btn.primary {
      background: var(--primary);
      color: #000;
      font-weight: 600;
      border-color: var(--primary);
    }
    .nav-btn.primary:hover {
      background: var(--primary-light);
    }

    /* Main Container */
    main {
      flex: 1;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
    }
    @media (max-width: 1100px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* Left Column: Player & Chapters */
    .player-section {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .video-card {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      position: relative;
    }
    video {
      width: 100%;
      display: block;
      max-height: 720px;
      background: #000;
    }

    .video-meta {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .video-current-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }
    .badge-pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-weight: 600;
    }
    .video-desc {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Chapters Bar */
    .chapters-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      padding: 18px;
    }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chapters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .chapter-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chapter-btn:hover {
      background: rgba(245, 158, 11, 0.12);
      border-color: var(--primary);
      color: #fff;
    }
    .chapter-btn.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--primary);
      color: var(--primary-light);
      font-weight: 600;
    }
    .ch-time {
      font-family: monospace;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
    }

    /* Lecture Notes Card */
    .notes-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      padding: 20px;
      line-height: 1.8;
      font-size: 14px;
    }
    .notes-card h3 {
      font-size: 16px;
      color: var(--primary-light);
      margin: 16px 0 8px 0;
    }
    .notes-card h3:first-child {
      margin-top: 0;
    }
    .notes-card p, .notes-card ul {
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    .notes-card ul {
      padding-left: 20px;
    }
    .notes-card code {
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
      font-family: monospace;
    }

    /* Right Column: Playlist */
    .playlist-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .playlist-header {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .playlist-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: normal;
    }
    .playlist-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .playlist-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .playlist-item:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }
    .playlist-item.active {
      border-color: var(--primary);
      background: rgba(245, 158, 11, 0.08);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.15);
    }
    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .item-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .item-tag.master {
      background: rgba(245, 158, 11, 0.2);
      color: var(--primary);
    }
    .item-dur {
      font-size: 12px;
      font-family: monospace;
      color: var(--text-muted);
    }
    .item-title {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      line-height: 1.4;
    }
    .item-desc {
      font-size: 12px;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="logo-badge">THEATER</span>
      <h1 class="header-title">🎬 影视口语深度精讲剧场</h1>
    </div>
    <div class="header-right">
      <a href="index.html" class="nav-btn">← 赖世雄·句子点读机</a>
      <a href="https://github.com/zhang370156449/laishixiong-player" target="_blank" class="nav-btn">GitHub</a>
    </div>
  </header>

  <main>
    <!-- Left Column: Video Player, Chapters, and Notes -->
    <section class="player-section">
      <div class="video-card">
        <video id="mainVideo" controls playsinline preload="metadata">
          <source src="videos/extra_ep01_masterclass.mp4" type="video/mp4">
          您的浏览器不支持 HTML5 视频播放。
        </video>
      </div>

      <div class="video-meta">
        <div class="meta-top">
          <h2 id="videoTitle" class="video-current-title">《Extr@ English》第01集：8分37秒全集深度拉片精解</h2>
          <span id="videoBadge" class="badge-pill">1080P 全高清横版 · 13章节</span>
        </div>
        <p id="videoDesc" class="video-desc">
          完整串联全片 5 大名场面 + 12 个底层核心母语语块。含完整底栏旁白字幕与原声双语字幕，带你建立‘画面刺激 ➔ 情绪共鸣 ➔ 肌肉记忆’的母语输出闭环。
        </p>
      </div>

      <!-- Quick Chapter Jump Navigation -->
      <div class="chapters-card">
        <div class="section-title">
          <span>⚡ 章节秒达时间轴 (点击直达对应段落)</span>
        </div>
        <div id="chaptersGrid" class="chapters-grid">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- Lecture Notes & Transcripts -->
      <div class="notes-card" id="notesContainer">
        <!-- Dynamically populated -->
      </div>
    </section>

    <!-- Right Column: Playlist of Breakdown Videos -->
    <aside class="playlist-section">
      <div class="playlist-header">
        <span>📚 剧场视频专栏</span>
        <span class="playlist-count" id="playlistCount">3 部视频已就绪</span>
      </div>
      <div class="playlist-container" id="playlistContainer">
        <!-- Dynamically populated -->
      </div>
    </aside>
  </main>

  <footer>
    <p>影视口语深度精讲剧场 · 基于母语具身认知与语块理论构建 · 后续持续更新</p>
  </footer>

  <script>
    // Playlist Data - Easily extendable for future episodes!
    const PLAYLIST = [
      {
        id: "ep01_full",
        title: "《Extr@ English》第01集：8分37秒全集深度拉片精解",
        badge: "全集大课 · 横版 1080P",
        duration: "08:37",
        src: "videos/extra_ep01_masterclass.mp4",
        desc: "全集一站式深度拉片！完整串联 5 大名场面 + 12 个底层核心母语语块。配有实时底栏旁白大字幕与原声双语字幕，专治听懂但开不了口的哑巴英语。",
        chapters: [
          { time: 0, title: "00:00 导读与具身心法引入" },
          { time: 33, title: "00:33 第一幕：留言机分手回击" },
          { time: 73, title: "01:13 精析 01：Did you get / It's finished" },
          { time: 106, title: "01:46 第二幕：阿根廷神秘来信" },
          { time: 171, title: "02:51 精析 02：What does it say / What about" },
          { time: 201, title: "03:21 第三幕：单车领地争夺" },
          { time: 246, title: "04:06 精析 03：Nobody uses / You are out" },
          { time: 276, title: "04:36 第四幕：Hector 登场与乌龙" },
          { time: 346, title: "05:46 精析 04：You don't understand / Well..." },
          { time: 377, title: "06:17 第五幕：洗澡与拒锅名场面" },
          { time: 432, title: "07:12 精析 05：Be my guest / Not my problem" },
          { time: 458, title: "07:38 第六幕：身世反转与变脸" },
          { time: 498, title: "08:18 终章：12 核心语块全景总览与闭环跟读" }
        ],
        notes: `
          <h3>📖 第 01 集 12 大黄金母语语块矩阵 (Key Chunks)</h3>
          <ul>
            <li><code>Did you get my message?</code> 极简口语询问，替代生硬书面语 <i>Have you received</i></li>
            <li><code>It's finished!</code> 决绝终结关系，finished 尾音果断下沉</li>
            <li><code>What does it say?</code> 问信件/报纸/路标内容专用动词 say，绝不用 write</li>
            <li><code>What about the rules?</code> 提出顾虑与协商的万能句式（那规矩怎么办？）</li>
            <li><code>Nobody uses my bike.</code> 绝对否定树立权威禁令</li>
            <li><code>If you touch it again, you are out!</code> 严重后果施压（滚蛋/出局）</li>
            <li><code>Is that clear?</code> 严肃权威确认，不容置疑</li>
            <li><code>No, you don't understand.</code> 委婉澄清误解</li>
            <li><code>Well, you can sleep here.</code> 口语词 Well 的退让折中语气</li>
            <li><code>Could you bring it up?</code> 高频礼貌求助祈使句</li>
            <li><code>Be my guest!</code> 毫无保留的大方应允（请便，随便用！）</li>
            <li><code>No way, not my problem!</code> 果断甩锅拒绝二连击</li>
          </ul>
          <h3>🧠 闭环落地建议</h3>
          <p>像街头中国小哥一样：将这 5 个关键片段反复盲配，直到每一个镜头都能自动唤醒台词。练完后打开 AI 语音助手，针对特定场景开展 Role-play 实战！</p>
        `
      },
      {
        id: "ep01_scene_breakup",
        title: "【中视频精讲】《Extr@》分手名场面：I told you last night",
        badge: "场景深拆 · 横版 1080P",
        duration: "01:42",
        src: "videos/extra_ep01_scene_breakup.mp4",
        desc: "聚焦第一幕动感单车前的愤怒分手名场面，深入拆解 told you 的同化摩擦连读规则与设立人际红线的绝招。",
        chapters: [
          { time: 0, title: "00:00 导读与背景引入" },
          { time: 16, title: "00:16 30秒无删减原声放映" },
          { time: 46, title: "00:46 语块拆解：Did you get..." },
          { time: 63, title: "01:03 连读与断句：I told you..." },
          { time: 81, title: "01:21 盲配挑战与闭环实战" }
        ],
        notes: `
          <h3>🎯 核心发音与心理动机</h3>
          <ul>
            <li><b>连读同化：</b><code>told you</code> 中尾音 /d/ 遇到 /j/ 摩擦同化为 <code>/toʊldʒuː/</code></li>
            <li><b>语调断句：</b>重读时间状语 <i>last night</i>，并在 <i>finished</i> 处戛然而止</li>
            <li><b>设立红线：</b><code>And don't call me [X]!</code> 强行剥夺对方叫亲昵小名的特权</li>
          </ul>
        `
      },
      {
        id: "ep01_short_bemyguest",
        title: "【短视频速学】老外说 Be my guest 到底是什么意思？",
        badge: "高频神句 · 竖屏 1080P",
        duration: "00:28",
        src: "videos/extra_ep01_short_bemyguest.mp4",
        desc: "28秒黄金短视频！切片 Hector 借浴室冲澡名场面，讲透为什么母语者不说 Yes 或 Sure，而是用 Be my guest。",
        chapters: [
          { time: 0, title: "00:00 黄金3秒吸睛 Hook" },
          { time: 5, title: "00:05 原片名场面还原" },
          { time: 13, title: "00:13 核心用法与避坑指南" }
        ],
        notes: `
          <h3>💡 Be my guest 核心用法</h3>
          <p><b>真正含义：</b>请便 / 随便用 / 别客气！（绝对不是“做我的客人”或“请客”！）</p>
          <ul>
            <li>借浴室/充电宝：“Can I use your charger?” ➔ “Be my guest!”</li>
            <li>拿最后一块食物：“Mind if I take this?” ➔ “Be my guest!”</li>
          </ul>
        `
      }
    ];

    let currentVideoIdx = 0;
    const videoEl = document.getElementById('mainVideo');
    const titleEl = document.getElementById('videoTitle');
    const badgeEl = document.getElementById('videoBadge');
    const descEl = document.getElementById('videoDesc');
    const chaptersGrid = document.getElementById('chaptersGrid');
    const notesContainer = document.getElementById('notesContainer');
    const playlistContainer = document.getElementById('playlistContainer');

    function loadVideo(index) {
      currentVideoIdx = index;
      const v = PLAYLIST[index];
      
      // Update DOM
      videoEl.src = v.src;
      titleEl.textContent = v.title;
      badgeEl.textContent = v.badge;
      descEl.textContent = v.desc;
      notesContainer.innerHTML = v.notes;

      // Update chapters
      chaptersGrid.innerHTML = '';
      v.chapters.forEach((ch, chIdx) => {
        const btn = document.createElement('button');
        btn.className = 'chapter-btn' + (chIdx === 0 ? ' active' : '');
        btn.innerHTML = `<span class="ch-time">${formatTime(ch.time)}</span><span>${ch.title.replace(/^\d+:\d+\s*/, '')}</span>`;
        btn.onclick = () => {
          videoEl.currentTime = ch.time;
          videoEl.play();
          updateActiveChapter(ch.time);
        };
        chaptersGrid.appendChild(btn);
      });

      // Update playlist selection styling
      renderPlaylist();
      videoEl.play();
    }

    function renderPlaylist() {
      playlistContainer.innerHTML = '';
      PLAYLIST.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'playlist-item' + (idx === currentVideoIdx ? ' active' : '');
        card.innerHTML = `
          <div class="item-top">
            <span class="item-tag ${idx === 0 ? 'master' : ''}">${item.badge.split('·')[0].trim()}</span>
            <span class="item-dur">${item.duration}</span>
          </div>
          <div class="item-title">${item.title}</div>
          <div class="item-desc">${item.desc}</div>
        `;
        card.onclick = () => loadVideo(idx);
        playlistContainer.appendChild(card);
      });
      document.getElementById('playlistCount').textContent = `${PLAYLIST.length} 部视频已就绪`;
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateActiveChapter(currentTime) {
      const v = PLAYLIST[currentVideoIdx];
      const buttons = chaptersGrid.querySelectorAll('.chapter-btn');
      let activeIdx = 0;
      for (let i = 0; i < v.chapters.length; i++) {
        if (currentTime >= v.chapters[i].time) {
          activeIdx = i;
        } else {
          break;
        }
      }
      buttons.forEach((btn, idx) => {
        if (idx === activeIdx) btn.classList.add('active');
        else btn.classList.remove('active');
      });
    }

    videoEl.addEventListener('timeupdate', () => {
      updateActiveChapter(videoEl.currentTime);
    });

    // Initialize
    renderPlaylist();
    loadVideo(0);
  </script>
</body>
</html>
